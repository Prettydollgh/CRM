  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  p.archived = !p.archived;
  saveData(); render();
}
function toggleShowArchivedProducts(checked){
  viewState.products.showArchived = checked;
  renderProducts();
}
function renderProducts(){
  const filtered = getFilteredSortedProducts();
  const archivedCount = DATA.products.filter(p=>p.archived).length;
  const rows = filtered.map((p)=>{
    const idx = p.__idx;
    const {stockOnHand, unitsSold, stockRemaining} = productComputed(p.name);
    let alertBadge;
    if(p.archived) alertBadge = badge('Archived');
    else if(Number(stockRemaining)<=0) alertBadge = badge('Out of Stock');
    else if(p.reorderLevel && stockRemaining < Number(p.reorderLevel)) alertBadge = badge('Low Stock');
    else alertBadge = badge('OK');
    return `<tr${p.archived?' style="opacity:.6;"':''}>
      <td>${p.name}</td><td>${p.colour||'—'}</td><td>${p.type||'—'}</td>
      <td>${fmtMoney(p.sellingPrice)}</td><td><input type="number" class="onhand-input" data-onhand="${idx}" value="${stockOnHand}" min="0" ${isStaff()?'disabled':''}></td><td>${unitsSold}</td>

        </select>
      </div>
      <div class="field" style="justify-content:flex-end;">
        <label style="display:flex;align-items:center;gap:6px;font-weight:normal;">
          <input type="checkbox" id="toggle_show_archived" ${viewState.products.showArchived?'checked':''}> Show Archived (${archivedCount})

function adjustProductOnHand(idx, newValStr){
  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  const newVal = Math.max(0, Math.round(Number(newValStr)||0));
  const current = productComputed(p.name).stockOnHand;
  const diff = newVal - current;
  if(diff === 0){ renderProducts(); return; }
  DATA.restocks.push({
    date: new Date().toISOString().slice(0,10),
    product: p.name,
    qty: diff,
    costPrice: null,
    supplier: null,
    consignmentId: 'ADJUSTMENT',
    notes: `Manual on-hand adjustment (was ${current}, set to ${newVal})`,
    createdAt: new Date().toISOString()
  });
  saveData(); render();
}
function adjustProductRemaining(idx, newValStr){
  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  const newVal = Math.round(Number(newValStr)||0);
  const {stockRemaining: current, unitsSold} = productComputed(p.name);
  const diff = newVal - current;
  if(diff === 0){ renderProducts(); return; }
  // Editing Remaining works backwards: since Remaining = On Hand - Sold, and Sold
  // reflects real order history that shouldn't change, the gap is absorbed as a
  // stock adjustment (same mechanism as the On Hand field) so On Hand moves by the
  // same amount and Remaining lands exactly on the value that was typed in.
  DATA.restocks.push({
    date: new Date().toISOString().slice(0,10),
    product: p.name,
    qty: diff,
    costPrice: null,
    supplier: null,
    consignmentId: 'ADJUSTMENT',
    notes: `Manual remaining adjustment (was ${current}, set to ${newVal}, on-hand shifted by ${diff>0?'+':''}${diff} to ${current+unitsSold+diff})`,
    createdAt: new Date().toISOString()
  });
  saveData(); render();
}
function exportProductsCSV(){
  if(isStaff()) return;
  const filtered = getFilteredSortedProducts();
  const rows = filtered.map(p=>{
    const {stockOnHand, unitsSold, stockRemaining} = productComputed(p.name);
    return [p.name, p.colour||'', p.type||'', p.sellingPrice, stockOnHand, unitsSold, stockRemaining, p.reorderLevel??''];
  });
  exportCSV('products.csv', ['Product','Colour/Packing','Type','Price','On Hand','Sold','Remaining','Reorder At'], rows);
}

function saveProduct(idx){
  if(isStaff()) return;
  const name = document.getElementById('p_name').value.trim();
  if(!name){ alert('Product name is required.'); return; }
  const rec = {
    name, colour: document.getElementById('p_colour').value.trim(),
    type: document.getElementById('p_type').value,
    costPrice: Number(document.getElementById('p_cost').value)||null,
    sellingPrice: Number(document.getElementById('p_price').value)||0,
    reorderLevel: Number(document.getElementById('p_reorder').value)||10,
  };
  if(idx!=null && idx>=0){
    DATA.products[idx] = rec;
  }else{
    DATA.products.push(rec);
    const openingEl = document.getElementById('p_opening');
    const opening = openingEl ? Number(openingEl.value)||0 : 0;
    if(opening>0){
      DATA.restocks.push({date:new Date().toISOString().slice(0,10), product:name, qty:opening, costPrice:null, supplier:null, consignmentId:'OPENING STOCK', notes:'Opening balance', createdAt:new Date().toISOString()});
    }
  }
  saveData(); closeModal(); render();
}
function deleteProduct(idx){
  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  if(!confirm(`Delete product "${p.name}"? Its restock and order-item history will stay on record.`)) return;
  DATA.products.splice(idx,1);
  saveData(); closeModal(); render();
}

/* ---------- RESTOCKS ---------- */
function getFilteredSortedRestocks(){
  const withIdx = DATA.restocks.map((r,idx)=>({...r, __idx:idx}));
  let items = applySearch(withIdx, viewState.restocks.q, ['product','supplier','consignmentId']);
  items = applySort(items, 'restocks', {
    date: r=>r.date, product: r=>r.product, qty: r=>Number(r.qty)||0,
    cost: r=>Number(r.costPrice)||0, supplier: r=>r.supplier, created: r=>r.__idx,
  });
  if(!viewState.restocks.sortKey) items = [...items].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return items;
}

/* ---- Expected Restocks (incoming batches not yet arrived) ---- */
function expectedRestockStatus(e){
  if(e.status==='Received') return 'Received';
  const today = new Date(); today.setHours(0,0,0,0);
  if(e.expectedDate && new Date(e.expectedDate) < today) return 'Overdue';
  return 'Pending';
}
function getFilteredSortedExpectedRestocks(){
  const withIdx = (DATA.expectedRestocks||[]).map((e,idx)=>({...e, __idx:idx}));
  let items = applySearch(withIdx, viewState.expectedRestocks.q, ['product','supplier','notes']);
  items = applySort(items, 'expectedRestocks', {
    date: e=>e.expectedDate, product: e=>e.product, qty: e=>Number(e.qty)||0,
    cost: e=>Number(e.costPrice)||0, supplier: e=>e.supplier, status: e=>expectedRestockStatus(e), created: e=>e.__idx,
  });
  if(!viewState.expectedRestocks.sortKey) items = [...items].sort((a,b)=>{
    // Pending/Overdue batches first (soonest first), Received batches last
    const aRec = a.status==='Received', bRec = b.status==='Received';
    if(aRec!==bRec) return aRec ? 1 : -1;
    return (a.expectedDate||'').localeCompare(b.expectedDate||'');
  });
  return items;
}

function saveExpectedRestock(idx){
  if(isStaff()) return;
  const product = document.getElementById('e_product').value.trim();
  const qty = Number(document.getElementById('e_qty').value)||0;
  const expectedDate = document.getElementById('e_date').value;
  if(!product || !qty || !expectedDate){ alert('Item, quantity and expected landing date are required.'); return; }
  const existing = (idx!=null && idx>=0) ? DATA.expectedRestocks[idx] : null;
  const rec = {
    product, qty, expectedDate,
    costPrice: Number(document.getElementById('e_cost').value)||null,
    supplier: document.getElementById('e_supplier').value.trim(),
    notes: document.getElementById('e_notes').value.trim(),
    status: existing?.status || 'Pending',
    createdAt: existing?.createdAt || new Date().toISOString(),
    receivedAt: existing?.receivedAt || null,
  };
  if(!DATA.expectedRestocks) DATA.expectedRestocks = [];
  if(idx!=null && idx>=0) DATA.expectedRestocks[idx] = rec; else DATA.expectedRestocks.push(rec);
  saveData(); closeModal(); render();
}
function deleteExpectedRestock(idx){
  if(isStaff()) return;
  if(!confirm('Delete this expected batch entry?')) return;
  DATA.expectedRestocks.splice(idx,1);
  saveData(); closeModal(); render();

function markExpectedRestockReceived(idx){
  if(isStaff()) return;
  const e = DATA.expectedRestocks[idx];
  if(!e) return;
  if(!confirm(`Mark "${e.product}" (qty ${e.qty}) as received? This will add it to the Restock Log so stock is updated.`)) return;
  DATA.restocks.push({
    date: new Date().toISOString().slice(0,10),
    product: e.product, qty: e.qty, costPrice: e.costPrice||null,
    supplier: e.supplier||null, consignmentId: null,
    notes: `Received from expected batch logged ${fmtDate(e.expectedDate)}` + (e.notes?` — ${e.notes}`:''),
    createdAt: new Date().toISOString(),
  });
  const created = ensureProductExists(e.product, {costPrice: e.costPrice});
  e.status = 'Received';
  e.receivedAt = new Date().toISOString();
  saveData(); closeModal(); render();
  if(created) alert(`"${e.product}" wasn't a known product, so it was added to the Products tab automatically (type: Other, selling price: 0). Edit it there to set the correct type and price.`);
}

// If a restock (direct or from an Expected Batch) names a product that doesn't exist yet in
// DATA.products, auto-create a minimal product record for it instead of silently losing the
// stock. Uses safe defaults (type 'Other', selling price 0) that the owner can fill in later
// on the Products tab. Returns true if a new product was created.
function ensureProductExists(name, opts={}){
  if(!name) return false;
  if(DATA.products.some(p=>p.name===name)) return false;
  DATA.products.push({
    name,
    colour: '',
    type: 'Other',
    costPrice: opts.costPrice ?? null,
    sellingPrice: 0,
    reorderLevel: 10,
  });
  return true;
}

function saveRestock(idx){
  if(isStaff()) return;
  const product = document.getElementById('r_product').value.trim();
  const qty = Number(document.getElementById('r_qty').value)||0;
  if(!product || !qty){ alert('Product and quantity are required.'); return; }
  const existing = (idx!=null && idx>=0) ? DATA.restocks[idx] : null;
  const rec = {
    date: document.getElementById('r_date').value, product, qty,
    costPrice: Number(document.getElementById('r_cost').value)||null,
    supplier: document.getElementById('r_supplier').value.trim(),
    consignmentId: document.getElementById('r_consignment').value.trim(),
    createdAt: existing?.createdAt || new Date().toISOString(),
  };
  if(idx!=null && idx>=0) DATA.restocks[idx] = rec; else DATA.restocks.push(rec);
  const created = ensureProductExists(product, {costPrice: rec.costPrice});
  saveData(); closeModal(); render();
  if(created) alert(`"${product}" wasn't a known product, so it was added to the Products tab automatically (type: Other, selling price: 0). Edit it there to set the correct type and price.`);
}

           (o.customer||'').toLowerCase().includes(term) ||
           invNo.toLowerCase().includes(term);

  select.innerHTML = '<option value="">— Select an order —</option>' +
    filtered.map(o=>`<option value="${o.orderId}">${o.orderId} · ${o.customer} · ${fmtDate(o.date)} · ${fmtMoneyVisible(o.total)}</option>`).join('');

function recalcInvoiceItemRow(cellEl){
  const row = cellEl.closest('tr');
  const cells = row.children;
  if(cells.length < 6) return;
  const qty = parseFloat((cells[3].textContent||'').replace(/[^0-9.\-]/g,''))||0;
  const price = parseFloat((cells[4].textContent||'').replace(/[^0-9.\-]/g,''))||0;
  cells[5].textContent = fmtMoneyVisible(qty*price);
  recalcInvoiceSubtotalFromItems();
}

function recalcInvoiceSubtotalFromItems(){
  const body = document.getElementById('invItemsBody');
  const block = document.getElementById('invTotalsBlock');
  if(!body || !block) return;
  let subtotal = 0;
  body.querySelectorAll('tr').forEach(r=>{
    const cell = r.children[5];
    if(cell) subtotal += parseFloat((cell.textContent||'').replace(/[^0-9.\-]/g,''))||0;
  });
  block.dataset.subtotal = subtotal;
  const subtotalDisplay = document.getElementById('inv_subtotal_display');
  if(subtotalDisplay) subtotalDisplay.textContent = fmtMoneyVisible(subtotal);
  recalcInvoiceTotals();
}

function recalcInvoiceTotals(){
  const block = document.getElementById('invTotalsBlock');
  const subtotal = Number(block.dataset.subtotal)||0;
  const discount = Number(document.getElementById('inv_discount').value)||0;
  const delivery = Number(document.getElementById('inv_delivery').value)||0;
  const paid = Number(document.getElementById('inv_paid').value)||0;
  const totalDue = subtotal - discount + delivery;
  const balance = totalDue - paid;
  document.getElementById('inv_total_due').textContent = fmtMoneyVisible(totalDue);
  document.getElementById('inv_balance_due').textContent = fmtMoneyVisible(balance);
}

function getPeriodRange(granularity, refDate){
  const d = new Date(refDate); d.setHours(0,0,0,0);
  let start, end, label;
  if(granularity==='day'){
    start = new Date(d); end = new Date(d); end.setDate(end.getDate()+1);
    label = start.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  } else if(granularity==='week'){
    const dow = (d.getDay()+6)%7;
    start = new Date(d); start.setDate(d.getDate()-dow);
    end = new Date(start); end.setDate(start.getDate()+7);
    const endIncl = new Date(end); endIncl.setDate(end.getDate()-1);
    label = 'Week of '+start.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+endIncl.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  } else if(granularity==='year'){
    start = new Date(d.getFullYear(),0,1); end = new Date(d.getFullYear()+1,0,1);
    label = String(d.getFullYear());
  } else {
    start = new Date(d.getFullYear(),d.getMonth(),1); end = new Date(d.getFullYear(),d.getMonth()+1,1);
    label = start.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  }
  const span = end-start;
  const prevEnd = new Date(start), prevStart = new Date(start.getTime()-span);
  return {start,end,prevStart,prevEnd,label};
}
function inRange(dateStr, start, end){
  if(!dateStr) return false;
  const t = new Date(dateStr.length<=10 ? dateStr+'T00:00:00' : dateStr).getTime();
  if(isNaN(t)) return false;
  return t>=start.getTime() && t<end.getTime();
}
function pctChange(cur, prev){ if(!prev) return cur>0 ? null : 0; return ((cur-prev)/Math.abs(prev))*100; }
function trendBadge(pct, goodIsUp=true){
  if(pct===null) return '<span class="kpi-sub">new activity</span>';
  const up = pct>0.5, down = pct<-0.5;
  const cls = up ? (goodIsUp?'good':'warn') : down ? (goodIsUp?'warn':'good') : '';
  const arrow = up ? '▲' : down ? '▼' : '—';
  return `<div class="kpi-sub ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}% vs previous period</div>`;
}
function shiftReportPeriod(dir){
  const g=reportGranularity, d=new Date(reportRefDate);
  if(g==='day') d.setDate(d.getDate()+dir);
  else if(g==='week') d.setDate(d.getDate()+7*dir);
  else if(g==='year') d.setFullYear(d.getFullYear()+dir);
  else d.setMonth(d.getMonth()+dir);
  reportRefDate = d; render();
}
function setReportGranularity(g){ reportGranularity = g; reportRefDate = new Date(); render(); }

          <td><select onchange="changeCrmUserRole(${jsAttr(u.uid)},this.value)" ${u.uid===currentUser?.uid?'disabled':''}>
            <option value="owner" ${u.role==='owner'?'selected':''}>Owner</option>
            <option value="staff" ${u.role==='staff'?'selected':''}>Staff</option>
          </select></td>
          <td>${u.uid===currentUser?.uid?'Current user':''}</td>
        </tr>`), 'No team members yet.') : '')}
      </div>
    </div>
    ${(()=>{const legacy=legacyMigratedPayments();if(!legacy.length)return '';const total=legacy.reduce((s,p)=>s+Number(p.amount||0),0);return `
    <div class="card">
      <div class="card-head"><h3>Fix Legacy Payment Methods</h3></div>
      <div class="data-block">
        <div class="hint">${legacy.length} payment(s) totaling ${fmtMoney(total)} are labeled "Legacy (migrated)" — these were backfilled from old orders before the payment ledger existed, so the CRM doesn't know how they were actually paid. Finance can't credit them to any Cash &amp; Bank account (like MTN Mobile Money) until they're reclassified.</div>
        <div class="btn-row">
          <button class="btn" onclick="reclassifyLegacyPayments()" ${isStaff()?'disabled':''}>Reclassify All as Mobile Money</button>
        </div>
        ${isStaff()?'<div class="hint" style="margin-top:8px;">Only the Owner can do this.</div>':''}
      </div>
    </div>`;})()}
    <div class="card">
      <div class="card-head"><h3>Shared Database (Firebase)</h3></div>
      <div class="data-block">
        <div class="hint">${firebaseConfigured
          ? 'This CRM is connected to a shared database. Use the button below once to push whatever is currently loaded (including the sample/starter data) up to Firebase — after that, every save happens automatically and every device sees the same data.'
          : 'No shared database is connected yet — data currently only lives in this file. Add a Firebase Database URL to FIREBASE_DB_URL near the top of the script to enable this.'}</div>
        <div class="btn-row">
          <button class="btn" onclick="pushDataToFirebaseNow()" ${firebaseConfigured?'':'disabled'}>⬆ Push Current Data to Firebase Now</button>
        </div>
        <div id="firebaseSyncStatus" class="hint" style="margin-top:8px;"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Local Backup (This PC)</h3></div>
      <div class="data-block">
        <div class="hint">Every save is now also kept on this PC — just in case Firebase ever fails. A copy is stored automatically in this browser, and you can optionally connect a real file on disk that updates itself every time something changes.</div>
        ${localBackupFileStatus === 'unsupported' ? `
          <div class="hint" style="margin-top:8px;">Real-file backup needs Chrome or Edge on a computer. The automatic browser backup above is active regardless.</div>
        ` : localBackupFileStatus === 'connected' ? `
          <div class="hint" style="margin-top:8px;color:var(--green);">✓ Connected to <b>${localBackupFileName}</b> — saved automatically on every change${localBackupLastSavedAt ? ' (last write: ' + localBackupLastSavedAt.toLocaleTimeString() + ')' : ''}.</div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn-ghost" onclick="chooseLocalBackupFile()">Choose a Different File</button>
            <button class="btn-ghost" onclick="forgetLocalBackupFile()">Disconnect</button>
          </div>
        ` : localBackupFileStatus === 'needs-permission' ? `
          <div class="hint" style="margin-top:8px;color:var(--red);">Connected to <b>${localBackupFileName}</b>, but this tab needs permission again before it can keep writing to it.</div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" onclick="reconnectLocalBackupFile()">Reconnect Backup File</button>
            <button class="btn-ghost" onclick="forgetLocalBackupFile()">Disconnect</button>
          </div>
        ` : `
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" onclick="chooseLocalBackupFile()">Choose Backup File on This PC</button>
          </div>
        `}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Full Backup</h3></div>
      <div class="data-block">
        <div class="hint">Download a complete backup of every customer, order, product, restock, lead and interaction — as one JSON file (for restoring here later) or as an Excel workbook with a tab per table (for opening in Excel/Sheets). Use Restore to bring a JSON backup back into the app, or to move it to another device/browser.</div>
        <div class="btn-row">
          <button class="btn" onclick="exportBackup()">⬇ Download Full Backup (JSON)</button>
          <button class="btn" onclick="exportBackupExcel()">⬇ Download Full Backup (Excel)</button>
          <button class="btn-ghost" onclick="triggerImportBackup()">⬆ Restore from Backup</button>
          <input type="file" id="importBackupInput" accept=".json,application/json" style="display:none;" onchange="importBackupFile(this)">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Export Tables as CSV</h3></div>
      <div class="data-block">
        <div class="hint">Download any table as a spreadsheet (.csv), respecting whatever search/sort you last used on that page.</div>
        <div class="btn-row">
          <button class="btn-ghost" onclick="exportCustomersCSV()">Customers CSV</button>
          <button class="btn-ghost" onclick="exportOrdersCSV()">Orders CSV</button>
          <button class="btn-ghost" onclick="exportProductsCSV()">Products CSV</button>
          <button class="btn-ghost" onclick="exportRestocksCSV()">Restocks CSV</button>
          <button class="btn-ghost" onclick="exportLeadsCSV()">Leads CSV</button>
          <button class="btn-ghost" onclick="exportInteractionsCSV()">Interactions CSV</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Import Customers / Products from CSV</h3></div>
      <div class="data-block">
        <div class="hint">CSV needs a header row. Customers: <code>name,phone,address,segment</code>. Products: <code>name,colour,type,costPrice,sellingPrice,reorderLevel</code>. Rows with a name matching an existing record update it; new names are added.</div>
        <div class="btn-row">
          <label class="btn-ghost" style="cursor:pointer;">Import Customers CSV<input type="file" accept=".csv,text/csv" style="display:none;" onchange="importCustomersCSV(this)"></label>
          <label class="btn-ghost" style="cursor:pointer;">Import Products CSV<input type="file" accept=".csv,text/csv" style="display:none;" onchange="importProductsCSV(this)"></label>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Fix Product Name Mismatches</h3></div>
      <div class="data-block">
        <div class="hint">If a product was renamed (e.g. via a CSV import), older Orders or Restock rows that used the old name will silently drop out of Units Sold / Stock totals for that product. Use this to find and re-link those old references to the current product name.</div>
        <div class="btn-row">
          <button class="btn-ghost" onclick="openRenameMismatchesModal()">Scan for Mismatches</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- router ---------- */
function render(){
  if(isStaff() && (currentView==='data' || currentView==='report')) currentView = 'dashboard';
  // If we're still on the same page (e.g. after saving/deleting/editing an item),
  // keep the scroll position instead of jumping back to the top of the list.
  const samePageRefresh = (currentView === lastRenderedView);
  const scrollY = window.scrollY;
  renderNav();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='customers') renderCustomers();
  else if(currentView==='customerDetail') renderCustomerDetail(selectedCustomerDetail);
  else if(currentView==='orders') renderOrders();
  else if(currentView==='invoices') renderInvoices();
  else if(currentView==='products') renderProducts();
  else if(currentView==='restocks') renderRestocks();
  else if(currentView==='leads') renderLeads();
  else if(currentView==='interactions') renderInteractions();
  else if(currentView==='report') renderReportView();
  else if(currentView==='data') renderDataView();
  const mainEl = document.getElementById('main');
  if(!samePageRefresh){
    mainEl.style.animation = 'none';
    void mainEl.offsetWidth;
    mainEl.style.animation = '';
  }
  if(samePageRefresh){
    window.scrollTo(0, scrollY);
  }else{
    window.scrollTo(0, 0);
  }
  lastRenderedView = currentView;
}

window.addEventListener('error', e=>{ console.warn('CRM app error (page kept visible):', e.message); });
try{ initLoginScreen(); }catch(e){ console.warn('initLoginScreen failed', e); }
try{
  firebaseInit();
}catch(fatal){
  console.error('Fatal startup error', fatal);
  const ls=document.getElementById('loginScreen');
  if(ls) ls.style.display='flex';
  setLoginError('Something went wrong starting the app: '+(fatal?.message||fatal)+'. Try reloading the page.');
}
</script>
</body>
</html>
