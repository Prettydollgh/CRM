<style>
  :root{
    --bg:#FFFAEC;
    --surface:#FFFFFF;
    --surface-2:#FFF1C2;
    --border:#F6DFA0;
    --gold:#D6488B;
    --gold-bright:#EE6FAB;
    --text:#2B2420;
    --text-muted:#8A7C6E;
    --green:#3F7A5B;
    --amber:#C99A1F;
    --red:#A23B3B;
    --btn-text:#FFFFFF;
    --radius:12px;
    --ease:cubic-bezier(.22,.8,.28,1);
    --shadow-sm:0 2px 10px rgba(60,40,20,.06);
    --shadow-md:0 10px 32px rgba(60,40,20,.10);
    --shadow-gold:0 0 0 1px rgba(214,72,139,.12), 0 8px 20px rgba(214,72,139,.06);
  }
  :root.theme-dark{
    --bg:#241925;
    --surface:#2E1F2C;
    --surface-2:#3A2635;
    --border:#5A3B52;
    --gold:#F286BE;
    --gold-bright:#FFACD8;
    --text:#F8ECF3;
    --text-muted:#C2A6B9;
    --green:#6FAE8B;
    --amber:#E0B23E;
    --red:#E08A8A;
    --btn-text:#2B1420;
    --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    --shadow-md:0 10px 32px rgba(0,0,0,.5);
    --shadow-gold:0 0 0 1px rgba(242,134,190,.18), 0 8px 20px rgba(242,134,190,.09);
  }
  *{box-sizing:border-box;}
  html{scrollbar-color:var(--border) transparent;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-bright);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes softPulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:.7;transform:scale(1.06);}}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .app{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:linear-gradient(180deg,#FFF6D9,#FFE9AC);
    border-right:1px solid var(--border);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:28px;
    box-shadow:var(--shadow-sm);
    position:relative;
    z-index:1;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
  .brand-ring{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;flex-shrink:0;
    background:var(--surface);
    box-shadow:0 0 0 1px var(--border);
  }
  .brand-ring img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-name{font-family:'Playfair Display',serif;font-size:15.5px;letter-spacing:0.06em;color:var(--gold-bright);line-height:1.15;}
  .brand-sub{font-size:9.5px;letter-spacing:0.22em;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}

  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    color:var(--text-muted);font-size:13.5px;font-weight:500;
    transition:background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), padding-left .2s var(--ease);
    user-select:none;
    border-left:2px solid transparent;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);padding-left:15px;}
  .nav-item.active{background:var(--surface-2);color:var(--gold-bright);border-left-color:var(--gold);}
  .nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;transition:opacity .2s var(--ease),transform .2s var(--ease);}
  .nav-item.active .nav-dot{opacity:1;transform:scale(1.3);}

  .sidebar-foot{margin-top:auto;font-size:10.5px;color:var(--text-muted);line-height:1.5;padding:0 4px;}

  /* ---- Main ---- */
  main{flex:1;padding:34px 42px 60px;max-width:1280px;}
  #main{animation:fadeSlideIn .4s var(--ease);}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;letter-spacing:.01em;}
  .page-sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
  .btn{
    background:var(--gold);color:var(--btn-text);border:none;padding:9px 16px;border-radius:7px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    transition:background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
  }
  .btn:hover{background:var(--gold-bright);transform:translateY(-1px);box-shadow:0 6px 16px rgba(122,46,58,.18);}
  .btn:active{transform:scale(0.97);}
  .btn-ghost{
    background:transparent;color:var(--text-muted);border:1px solid var(--border);
    padding:8px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--gold);transform:translateY(-1px);}
  .btn-ghost:active{transform:scale(0.97);}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-ghost:disabled:hover{color:var(--text-muted);border-color:var(--border);transform:none;}

  /* ---- Stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:30px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;position:relative;overflow:hidden;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    animation:fadeSlideIn .45s var(--ease) backwards;
  }
  .stat-grid .stat-card:nth-child(1){animation-delay:.02s;}
  .stat-grid .stat-card:nth-child(2){animation-delay:.05s;}
  .stat-grid .stat-card:nth-child(3){animation-delay:.08s;}
  .stat-grid .stat-card:nth-child(4){animation-delay:.11s;}
  .stat-grid .stat-card:nth-child(5){animation-delay:.14s;}
  .stat-grid .stat-card:nth-child(6){animation-delay:.17s;}
  .stat-grid .stat-card:nth-child(7){animation-delay:.2s;}
  .stat-grid .stat-card:nth-child(8){animation-delay:.23s;}
  .stat-grid .stat-card:nth-child(9){animation-delay:.26s;}
  .stat-grid .stat-card:nth-child(10){animation-delay:.29s;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(122,46,58,.3);}
  .stat-card.clickable{cursor:pointer;}
  .stat-card.clickable:hover{border-color:var(--gold);box-shadow:var(--shadow-gold);}
  .stat-card.clickable:active{transform:translateY(-1px) scale(.99);}
  .stat-card::before{
    content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;
    border:1px solid rgba(122,46,58,0.10);transition:transform .4s var(--ease);
  }
  .stat-card:hover::before{transform:scale(1.15);}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .stat-value{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--text);transition:color .2s var(--ease);}
  .stat-value.warn{color:var(--amber);}
  .stat-value.danger{color:var(--red);}
  .stat-value.good{color:var(--green);}

  /* ---- Selector row (month/year, invoice-style) ---- */
  .selector-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);}
  select,input,textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;outline:none;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(122,46,58,.12);}

  /* ---- Progress bar ---- */
  .progress-wrap{margin-top:6px;}
  .progress-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:99px;transition:width .6s var(--ease);}
  .progress-label{font-size:11.5px;color:var(--text-muted);margin-top:6px;}

  /* ---- Tables ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow-sm);transition:box-shadow .25s var(--ease);}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .trend-chart{padding:16px 20px 8px;}
  .trend-chart svg{display:block;}
  body.role-staff .owner-only, body.role-staff .icon-btn{display:none !important;}
  .card-head h3{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;margin:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
     padding:10px 20px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;
     position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--border);}
  td{padding:11px 20px;border-bottom:1px solid rgba(180,150,110,0.3);color:var(--text);white-space:nowrap;}
  tbody tr{transition:background .15s var(--ease);}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--text-muted);font-style:italic;text-align:center;padding:26px;}
  .time-stamp{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;letter-spacing:.02em;}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;transition:transform .15s var(--ease);}
  .badge.active,.badge.ok,.badge.converted,.badge.yes,.badge.fully-paid,.badge.delivered,.badge.positive{background:rgba(63,122,91,.14);color:var(--green);}
  .badge.at-risk,.badge.new,.badge.partially-paid,.badge.order-received,.badge.no,.badge.neutral{background:rgba(168,103,42,.14);color:var(--amber);}
  .badge.churned,.badge.low-stock,.badge.not-paid,.badge.lost,.badge.negative{background:rgba(162,59,59,.14);color:var(--red);}
  .badge.out-of-stock{background:rgba(162,59,59,.3);color:var(--red);font-weight:700;}
  .badge.archived{background:rgba(0,0,0,.08);color:#71675a;}

  .table-scroll{overflow:auto;max-height:min(64vh,620px);}
  .onhand-input{width:64px;padding:5px 8px;text-align:right;font-size:13px;}
  .sort-th{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:3px;transition:color .15s var(--ease);}
  .sort-th:hover{color:var(--gold-bright);}
  .toolbar-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow-sm);}
  .toolbar-row .field{min-width:220px;flex:1;}
  .toolbar-row .field input{width:100%;}
  .toolbar-spacer{flex:1 1 auto;}
  .cust-link{color:var(--gold-bright);cursor:pointer;font-weight:600;text-decoration:none;}
  .cust-link:hover{text-decoration:underline;}
  .timeline-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(180,150,110,0.3);}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .timeline-dot.order{background:var(--gold);}
  .timeline-dot.interaction{background:var(--green);}
  .timeline-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;}
  .timeline-date{margin-left:auto;font-size:11.5px;color:var(--text-muted);}
  .timeline-body{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
  .data-block{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .data-block .hint{color:var(--text-muted);font-size:13px;line-height:1.5;}
  .data-block .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .data-block code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px;color:var(--gold-bright);}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .wa-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:#25D366;color:#fff;
    font-size:12px;text-decoration:none;margin-left:6px;vertical-align:middle;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .wa-btn:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(37,211,102,.4);}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    padding:5px 10px;border-radius:6px;font-size:11.5px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease);
  }
  .icon-btn:hover{color:var(--text);border-color:var(--gold);transform:translateY(-1px);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,8,5,0.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
    opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s linear .22s;
  }
  .modal-backdrop.show{opacity:1;visibility:visible;transition:opacity .22s var(--ease);}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:26px 28px;
    box-shadow:var(--shadow-md);
    transform:scale(.94) translateY(8px);opacity:0;
    transition:transform .28s var(--ease),opacity .22s var(--ease);
  }
  .modal-backdrop.show .modal{transform:scale(1) translateY(0);opacity:1;}
  .modal.modal-wide{max-width:920px;}
  @media (max-width:960px){ .modal.modal-wide{max-width:96vw;} }
  .modal h3{font-family:'Playfair Display',serif;font-size:19px;margin:0 0 18px;}
  .form-grid{display:flex;flex-direction:column;gap:14px;}
  .form-grid label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  .items-editor{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-2);}
  .item-row{display:grid;grid-template-columns:1fr 110px 60px 80px auto;gap:8px;margin-bottom:8px;align-items:center;}
  .item-row input{width:100%;}
  .it-product-wrap{display:flex;gap:4px;align-items:center;}
  .it-product-wrap .it-product{flex:1;min-width:0;}
  .it-browse-btn{flex:0 0 auto;padding:6px 8px;font-size:13px;line-height:1;}
  .product-picker-panel{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md,0 8px 24px rgba(0,0,0,.18));width:320px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;overflow:hidden;}
  .product-picker-panel input{width:100%;box-sizing:border-box;border:none;border-bottom:1px solid var(--border);padding:10px 12px;font-size:13px;background:transparent;color:inherit;}
  .product-picker-panel input:focus{outline:none;}
  .product-picker-list{max-height:260px;overflow-y:auto;}
  .product-picker-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(180,150,110,0.15);}
  .product-picker-item:last-child{border-bottom:none;}
  .product-picker-item:hover, .product-picker-item.active{background:rgba(122,46,58,.08);}
  .product-picker-item .pp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .product-picker-item .pp-price{color:var(--text-muted);font-size:12px;white-space:nowrap;}
  .product-picker-empty{padding:12px;font-size:12.5px;color:var(--text-muted);text-align:center;}
  .remove-item{cursor:pointer;color:var(--red);font-size:16px;background:none;border:none;padding:2px 6px;transition:transform .15s var(--ease);}
  .remove-item:hover{transform:scale(1.2);}
  .add-item-btn{font-size:12px;color:var(--gold);background:none;border:1px dashed var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;width:100%;margin-top:4px;transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease);}
  .add-item-btn:hover{border-color:var(--gold);background:rgba(122,46,58,.05);}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
    nav{flex-direction:row;}
    .sidebar-foot{display:none;}
    main{padding:22px;}
  }
  ::selection{background:rgba(122,46,58,.18);}

  /* ---- Invoice ---- */
  .invoice-toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);}
  .invoice-toolbar select{min-width:260px;}
  .invoice-paper{
    background:#ffffff;color:#1a1410;border-radius:10px;
    padding:34px 40px;max-width:820px;margin:0 auto;
    box-shadow:0 6px 30px rgba(0,0,0,.35);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    position:relative;z-index:0;overflow:hidden;
  }
  .inv-watermark{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);width:60%;max-width:460px;opacity:.32;z-index:-1;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .inv-watermark img{width:100%;display:block;}
  .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #7A2E3A;padding-bottom:16px;margin-bottom:18px;}
  .inv-brand{display:flex;gap:16px;align-items:center;}
  .inv-logo{width:92px;height:92px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#0c0906;border:3px solid #c9a24b;box-shadow:0 3px 12px rgba(0,0,0,.28);}
  .inv-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .inv-co-name{font-family:'Playfair Display',serif;font-weight:700;font-size:25px;letter-spacing:.03em;color:#1a1410;line-height:1.1;}
  .inv-co-legal{font-size:11px;color:#7A2E3A;margin-top:3px;font-weight:700;font-style:italic;letter-spacing:.02em;}
  .inv-co-sub{font-size:11.5px;color:#54432a;margin-top:5px;font-weight:500;}
  .inv-co-contact{font-size:11px;color:#54432a;margin-top:6px;font-weight:500;}
  .inv-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#7A2E3A;letter-spacing:.08em;text-align:right;}
  .inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px;}
  .inv-block h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a6b1f;margin:0 0 8px;font-weight:700;}
  .inv-block .row{font-size:13.5px;margin-bottom:4px;color:#1a1410;font-weight:500;}
  .inv-block .row b{color:#1a1410;font-weight:700;}
  .inv-pay-badge{display:inline-block;margin-top:2px;padding:4px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.04em;}
  .inv-pay-badge.not-paid{background:#f3d9d4;color:#9a2e20;}
  .inv-pay-badge.partially-paid,.inv-pay-badge.deposit-paid{background:#f6e3c4;color:#8a5a0d;}
  .inv-pay-badge.fully-paid{background:#d9ecd6;color:#2e6b28;}
  .inv-pay-badge.refunded{background:#e2e2e2;color:#444;}
  table.inv-items{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
  table.inv-items th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a6b1f;border-bottom:1.5px solid #7A2E3A;padding:8px 6px;font-weight:700;}
  table.inv-items td{padding:7px 6px;border-bottom:1px solid #e5dcc4;color:#1a1410;font-weight:500;}
  table.inv-items td.num,table.inv-items th.num{text-align:right;}
  .inv-totals{margin-left:auto;width:280px;font-size:13.5px;}
  .inv-totals .t-row{display:flex;justify-content:space-between;padding:5px 0;color:#1a1410;font-weight:500;}
  .inv-totals .t-row input{width:90px;text-align:right;background:#fff;border:1px solid #c9a24b;color:#1a1410;padding:4px 6px;border-radius:5px;font-size:13px;font-weight:600;}
  .inv-totals .t-row.due{font-weight:800;font-size:15.5px;border-top:1.5px solid #7A2E3A;margin-top:6px;padding-top:8px;color:#1a1410;}
  .inv-totals .t-row.balance{font-weight:800;color:#9a2e20;}
  .inv-footer{margin-top:20px;border-top:1px solid #e5dcc4;padding-top:14px;font-size:11.5px;color:#54432a;font-weight:500;}
  .inv-footer .thanks{margin-top:8px;font-family:'Playfair Display',serif;font-style:italic;color:#7A2E3A;font-size:13.5px;font-weight:600;}
  .invoice-actions{max-width:820px;margin:0 auto 16px;display:flex;justify-content:flex-end;align-items:center;gap:10px;}
  .invoice-edit-hint{max-width:820px;margin:0 auto 10px;font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  [contenteditable="true"]{cursor:text;border-radius:4px;transition:background .12s,box-shadow .12s;}
  [contenteditable="true"]:hover{background:rgba(122,46,58,.06);}
  [contenteditable="true"]:focus{outline:none;background:#fbf3da;box-shadow:0 0 0 2px #c9a24b;}

  @page{margin:10mm;}
  .print-only{display:none;}
  @media print{
    html,html.theme-dark,body{background:#ffffff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body *{visibility:hidden;}
    .invoice-paper, .invoice-paper *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .invoice-paper{position:absolute;top:0;left:0;box-shadow:none;max-width:100%;padding:0;border-radius:0;}
    .inv-watermark{visibility:visible;}
    .sidebar,.page-head,.invoice-toolbar,.invoice-actions,.invoice-edit-hint{display:none!important;}
    [contenteditable="true"]{background:transparent!important;box-shadow:none!important;}
    .report-printable, .report-printable *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .report-printable{position:absolute;top:0;left:0;width:100%;padding:16px;}
    .report-printable .print-only{display:block;}
    .report-printable .stat-card{break-inside:avoid;}
  }

  /* ---- Login screen ---- */
  .brand-ring{cursor:zoom-in;}
  .login-logo{cursor:zoom-in;}
  #logoLightbox{
    position:fixed;inset:0;background:rgba(5,3,1,0.88);z-index:200;
    display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  }
  #logoLightbox.show{display:flex;}
  #logoLightbox img{
    max-width:min(80vw,480px);max-height:80vh;width:100%;border-radius:50%;
    box-shadow:0 0 0 4px var(--gold),0 0 60px rgba(0,0,0,.6);
    object-fit:cover;aspect-ratio:1/1;
  }

  #loginScreen{
    position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#FFFDF2,#FFE7A8 75%);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .login-card{
    width:100%;max-width:340px;text-align:center;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:38px 32px 32px;
    box-shadow:var(--shadow-md);
    animation:popIn .5s var(--ease);
  }
  .login-logo{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;overflow:hidden;box-shadow:0 0 0 1px var(--border);}
  .login-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .login-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-bright);letter-spacing:.04em;}
  .login-sub{font-size:11.5px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;margin-bottom:26px;}
  .login-card input{width:100%;text-align:center;margin-bottom:12px;letter-spacing:.15em;}
  .login-card .btn{width:100%;padding:10px;margin-top:4px;}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}
  :root.theme-dark .sidebar{background:linear-gradient(180deg,#2E1F2C,#1D131C);}
  :root.theme-dark #loginScreen{background:radial-gradient(circle at 50% 20%,#2E1F2C,#180F17 75%);}
  .theme-switch{display:flex;gap:4px;padding:0 16px;margin-top:-8px;}
  .theme-btn{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    padding:6px 0;border-radius:6px;font-size:13px;cursor:pointer;line-height:1;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  }
  .theme-btn:hover{color:var(--text);border-color:var(--gold);}
  .theme-btn.active{background:var(--gold);color:var(--btn-text);border-color:var(--gold);}
  .login-links{margin-top:14px;font-size:12px;}

let currentUser = null;
let currentRole = 'staff';
function isStaff(){ return currentRole !== 'owner'; }
function applyRoleBodyClass(){ document.body.classList.toggle('role-staff', isStaff()); }

const FIREBASE_API_KEY='AIzaSyDsLpsbqLShEsXTNYbSMWXbztT-fu1nvhg';
function getApiKey(){ return localStorage.getItem('pd_crm_api_key') || FIREBASE_API_KEY; }
function initLoginScreen(){
  const ls=document.getElementById('loginScreen'), ar=document.getElementById('appRoot');
  if(ls) ls.style.display='flex';
  if(ar) ar.style.display='none';
  const keyInput=document.getElementById('authApiKey');
  if(keyInput) keyInput.value=localStorage.getItem('pd_crm_api_key')||'';
  const keyField=document.getElementById('apiKeyField');
  if(keyField) keyField.style.display = (getApiKey() && typeof firebase!=='undefined') ? 'none' : 'block';
  const notice=document.getElementById('setupNotice');
  if(notice) notice.style.display=getApiKey()?'none':'block';
  if(typeof firebase==='undefined' && notice){
    notice.innerHTML='<b>⚙ Firebase library did not load</b><br>Check your internet connection and reload this page to sign in.';
    notice.style.display='block';
    if(keyField) keyField.style.display='block';
  }
}
function setLoginError(msg){ const e=document.getElementById('loginError'); if(e) e.textContent=msg||''; }

function firebaseInit(){
  if(typeof firebase==='undefined'){
    setLoginError('The Firebase library failed to load (check your internet connection).');
    return false;
  }
  if(!getApiKey()){
    const notice=document.getElementById('setupNotice'); if(notice) notice.style.display='block';
    const keyField=document.getElementById('apiKeyField'); if(keyField) keyField.style.display='block';
    setLoginError('Enter the Firebase Web API Key above, then try again.');
    return false;
  }
  try{
    if(!firebase.apps.length){ firebase.initializeApp({apiKey:getApiKey(),authDomain:FIREBASE_AUTH_DOMAIN,projectId:FIREBASE_PROJECT_ID,databaseURL:FIREBASE_DB_URL}); }
    firebase.auth().onAuthStateChanged(async user=>{
      currentUser = user;
      if(!user){
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('appRoot').style.display='none';
        return;
      }
      try{
        await resolveCrmRole();
        applyRoleBodyClass();
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('appRoot').style.display='block';
        updateUserChip();
        await loadData();
      }catch(e){ setLoginError(e.message); }
    });
    return true;
  }catch(e){ setLoginError('Firebase could not start: '+e.message); return false; }
}
async function authQuery(){ if(currentUser) return '?auth='+encodeURIComponent(await currentUser.getIdToken()); return ''; }

// Each CRM user's role lives at {FIREBASE_PATH}/crmUsers/{uid} = {uid, name, email, role}.
// The very first person to access the CRM becomes Owner automatically — whether they arrived via
// "Create account" or by signing in with an email already registered elsewhere in this Firebase
// project (e.g. Finance). Everyone after that defaults to Staff (an Owner can promote someone
// later from Data & Backup -> CRM Team).
async function resolveCrmRole(){
  const myRes = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}/crmUsers/${currentUser.uid}.json${await authQuery()}`);
  if(myRes.ok){
    const rec = await myRes.json();
    if(rec && rec.role){ currentRole = rec.role; return; }
  }
  // No record for this uid yet — check whether ANY crm user exists at all.
  const allRes = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}/crmUsers.json${await authQuery()}`);
  const all = allRes.ok ? await allRes.json() : null;
  const role = (all && Object.keys(all).length) ? 'staff' : 'owner';
  try{
    await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}/crmUsers/${currentUser.uid}.json${await authQuery()}`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({uid:currentUser.uid, name:currentUser.email, email:currentUser.email, role, createdAt:new Date().toISOString()})
    });
  }catch(e){ /* if this write fails, we still fall back to the in-memory role below */ }
  currentRole = role;
}
function updateUserChip(){
  const el = document.getElementById('userChip');
  if(el) el.textContent = (currentUser?.email||'') + (isStaff() ? ' · Staff' : ' · Owner');
}

function signIn(){
  const k=document.getElementById('authApiKey')?.value.trim(); if(k) localStorage.setItem('pd_crm_api_key',k);
  setLoginError('');
  if(!firebaseInit()) return;
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPassword').value;
  if(!email||!pass){ setLoginError('Enter your email and password.'); return; }
  firebase.auth().signInWithEmailAndPassword(email,pass).catch(e=>setLoginError(e.message));
}
function openCreateAccount(){
  document.getElementById('loginLinksRow').style.display='none';
  document.getElementById('createAccountPanel').style.display='block';
  setLoginError('');
}
function closeCreateAccount(){
  document.getElementById('createAccountPanel').style.display='none';
  document.getElementById('loginLinksRow').style.display='block';
}
async function registerUser(){
  const k=document.getElementById('authApiKey')?.value.trim(); if(k) localStorage.setItem('pd_crm_api_key',k);
  setLoginError('');
  if(!firebaseInit()) return;
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPassword').value;
  const pass2=document.getElementById('regPassword2').value;
  if(!name||!email||!pass){ setLoginError('Fill in your name, email and a password.'); return; }
  if(pass!==pass2){ setLoginError('Passwords do not match.'); return; }
  try{
    const cred = await firebase.auth().createUserWithEmailAndPassword(email,pass);
    const listRes = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}/crmUsers.json${await authQuery()}`);
    const existing = listRes.ok ? await listRes.json() : null;
    const role = (existing && Object.keys(existing).length) ? 'staff' : 'owner';
    await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}/crmUsers/${cred.user.uid}.json${await authQuery()}`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({uid:cred.user.uid, name, email, role, createdAt:new Date().toISOString()})
    });
  }catch(e){ setLoginError(e.message); }
}
function resetPassword(){
  const k=document.getElementById('authApiKey')?.value.trim(); if(k) localStorage.setItem('pd_crm_api_key',k);
  setLoginError('');
  if(!firebaseInit()) return;
  const email=document.getElementById('authEmail').value.trim();
  if(!email){ setLoginError('Enter your email above first, then click "Forgot password?" again.'); return; }
  firebase.auth().sendPasswordResetEmail(email)
    .then(()=>setLoginError('Password reset email sent — check your inbox.'))
    .catch(e=>setLoginError(e.message));
}
function openChangePassword(){
  showModal(`
    <h3>Change Password</h3>
    <div class="form-grid">
      <div><label>New Password</label><input type="password" id="cp_new"></div>
      <div><label>Confirm New Password</label><input type="password" id="cp_confirm"></div>
    </div>
    <div class="login-error" id="cp_error" style="margin-bottom:0;"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveNewPassword()">Save</button>
    </div>
  `);
}
async function saveNewPassword(){
  const next = document.getElementById('cp_new').value.trim();
  const confirmVal = document.getElementById('cp_confirm').value.trim();
  if(!next || next !== confirmVal){
    document.getElementById('cp_error').textContent = 'New passwords must match and cannot be blank.';
    return;
  }
  try{
    await currentUser.updatePassword(next);
    closeModal();
    alert('Password updated.');
  }catch(e){
    document.getElementById('cp_error').textContent = e.message + (e.code==='auth/requires-recent-login' ? ' Please sign out and back in, then try again.' : '');
  }
}

  document.getElementById('logoLightboxImg').src = LOGO_DATA_URI;
  document.getElementById('logoLightbox').classList.add('show');
}
function closeLogoLightbox(){
  document.getElementById('logoLightbox').classList.remove('show');
}

const THEME_KEY = 'pdcrm_theme';
function getThemePref(){ return localStorage.getItem(THEME_KEY) || 'system'; }
function systemPrefersDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(pref){
  const dark = pref === 'dark' || (pref === 'system' && systemPrefersDark());
  document.documentElement.classList.toggle('theme-dark', dark);
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.themeChoice === pref);
  });
}
function setThemePref(pref){
  localStorage.setItem(THEME_KEY, pref);
  applyTheme(pref);
}
function wireThemeSwitch(){
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.addEventListener('click', ()=> setThemePref(b.dataset.themeChoice));
  });
  applyTheme(getThemePref());
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
      if(getThemePref() === 'system') applyTheme('system');
    });
  }
}
document.addEventListener('DOMContentLoaded', wireThemeSwitch);
if(document.readyState !== 'loading') wireThemeSwitch();

async function logout(){
  if(typeof firebase!=='undefined' && firebase.apps.length) await firebase.auth().signOut();
  currentRole = 'staff';
  currentUser = null;
  document.body.classList.remove('role-staff');
  DATA = null;
  UNDO_STACK = [];
  PRE_MUTATION_SNAPSHOT = null;
  document.getElementById('appRoot').style.display = 'none';
  initLoginScreen();
  setLoginError('');
}

// --- Local PC backup (in addition to Firebase) ---
// 1) Automatic, invisible browser-storage copy — always on, no setup.
// 2) Optional real file on disk — pick it once, it silently re-saves on every change (Chrome/Edge only).
const LOCAL_BACKUP_LS_KEY = 'pdcrm_local_backup';
const LOCAL_BACKUP_IDB_DB = 'pdcrm_backup_db';
const LOCAL_BACKUP_IDB_STORE = 'handles';
const LOCAL_BACKUP_IDB_KEY = 'backupFileHandle';
let localBackupFileHandle = null;
let localBackupFileStatus = 'unsupported'; // 'unsupported' | 'disconnected' | 'needs-permission' | 'connected'
let localBackupFileName = '';
let localBackupLastSavedAt = null;

function fsAccessSupported(){ return typeof window.showSaveFilePicker === 'function'; }

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(LOCAL_BACKUP_IDB_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(LOCAL_BACKUP_IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(LOCAL_BACKUP_IDB_STORE, 'readonly');
      const req = tx.objectStore(LOCAL_BACKUP_IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ console.error('idbGet failed', e); return null; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(LOCAL_BACKUP_IDB_STORE, 'readwrite');
      tx.objectStore(LOCAL_BACKUP_IDB_STORE).put(val, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ console.error('idbSet failed', e); return false; }
}

// Optional real file on disk, chosen once via the File System Access API.
async function restoreLocalBackupFileHandle(){
  if(!fsAccessSupported()){ localBackupFileStatus = 'unsupported'; return; }
  const handle = await idbGet(LOCAL_BACKUP_IDB_KEY);
  if(!handle){ localBackupFileStatus = 'disconnected'; return; }
  localBackupFileHandle = handle;
  localBackupFileName = handle.name || '';
  try{
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    localBackupFileStatus = perm === 'granted' ? 'connected' : 'needs-permission';
  }catch(e){
    console.error('checking file permission failed', e);
    localBackupFileStatus = 'needs-permission';
  }
}
async function chooseLocalBackupFile(){
  if(!fsAccessSupported()){
    alert('Your browser doesn\'t support saving directly to a file on your PC. Use Chrome or Edge for this feature — the automatic browser backup is still protecting your data either way.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'prettydollgh-crm-backup.json',
      types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }]
    });
    localBackupFileHandle = handle;
    localBackupFileName = handle.name || '';
    await idbSet(LOCAL_BACKUP_IDB_KEY, handle);
    localBackupFileStatus = 'connected';
    await writeLocalBackupFile();
    renderDataView();
  }catch(e){
    if(e && e.name !== 'AbortError') console.error('choosing backup file failed', e);
  }
}
async function reconnectLocalBackupFile(){
  if(!localBackupFileHandle) return chooseLocalBackupFile();
  try{
    const perm = await localBackupFileHandle.requestPermission({ mode: 'readwrite' });
    localBackupFileStatus = perm === 'granted' ? 'connected' : 'needs-permission';
    if(perm === 'granted') await writeLocalBackupFile();
  }catch(e){ console.error('requesting file permission failed', e); }
  renderDataView();
}
async function writeLocalBackupFile(){
  if(!localBackupFileHandle || localBackupFileStatus !== 'connected') return;
  try{
    const writable = await localBackupFileHandle.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
    localBackupLastSavedAt = new Date();
  }catch(e){
    console.error('writing local backup file failed', e);
    localBackupFileStatus = 'needs-permission';
  }
}
function forgetLocalBackupFile(){
  localBackupFileHandle = null;
  localBackupFileName = '';
  localBackupLastSavedAt = null;
  localBackupFileStatus = fsAccessSupported() ? 'disconnected' : 'unsupported';
  idbSet(LOCAL_BACKUP_IDB_KEY, null);
  renderDataView();
}

function toWhatsAppNumber(phone){
  if(!phone) return null;
  let digits = String(phone).replace(/[^0-9]/g,'');
  if(!digits) return null;
  if(digits.startsWith('00233')) digits = digits.slice(2);
  if(digits.startsWith('0')) digits = '233' + digits.slice(1);
  else if(digits.length===9) digits = '233' + digits;
  if(!digits.startsWith('233') || digits.length<11) return null;
  return digits;
}

  return `https://wa.me/${num}${message?('?text='+encodeURIComponent(message)):''}`;
}

function applySearch(items, q, fields){
  if(!q || !q.trim()) return items;
  const needle = q.trim().toLowerCase();
  return items.filter(item=>fields.some(f=>{
    const v = typeof f==='function' ? f(item) : item[f];
    return String(v??'').toLowerCase().includes(needle);
  }));
}
function applySort(items, view, extractors){
  const st = viewState[view];
  if(!st.sortKey || !extractors[st.sortKey]) return items;
  const ext = extractors[st.sortKey];
  return [...items].sort((a,b)=>{
    let av = ext(a), bv = ext(b);
    if(typeof av==='string') av = av.toLowerCase();
    if(typeof bv==='string') bv = bv.toLowerCase();
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(av<bv) return -1*st.sortDir;
    if(av>bv) return 1*st.sortDir;
    return 0;
  });
}
function sortIndicator(view, key){
  const st = viewState[view];
  if(st.sortKey!==key) return '';
  return st.sortDir===1 ? ' ▲' : ' ▼';
}

function csvEscape(val){
  const s = String(val??'');
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(',')));
  downloadFile(filename, lines.join('\r\n'), 'text/csv;charset=utf-8;');
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1); // strip BOM
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      } else { field+=c; i++; continue; }
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]??'').trim());
    return obj;
  });
}

function importBackupFile(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const required = ['customers','orders','orderItems','products','restocks','leads','interactions'];
      const missing = required.filter(k=>!Array.isArray(parsed[k]));
      if(missing.length){ alert('This file is missing expected data: '+missing.join(', ')+'. Import cancelled.'); fileInput.value=''; return; }
      if(!confirm('This will REPLACE all current data with the contents of this backup file. This cannot be undone. Continue?')){ fileInput.value=''; return; }
      DATA = parsed;
      if(!Array.isArray(DATA.expectedRestocks)) DATA.expectedRestocks = [];
      saveData();
      fileInput.value='';
      render();
      alert('Backup restored successfully.');
    }catch(err){
      alert('Could not read this file as a valid backup (invalid JSON).');
      fileInput.value='';
    }
  };
  reader.readAsText(file);
}
function importCustomersCSV(fileInput){
  if(isStaff()) return;
  const file = fileInput.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const records = parseCSV(e.target.result);
      if(!records.length){ alert('No rows found in this CSV.'); fileInput.value=''; return; }
      let added=0, updated=0;
      records.forEach(r=>{
        const name = r.name || r.Name;
        if(!name) return;
        const rec = { name, phone: r.phone||r.Phone||'', address: r.address||r.Address||'', segment: r.segment||r.Segment||'' };
        const idx = DATA.customers.findIndex(c=>c.name===name);
        if(idx>=0){ DATA.customers[idx] = {...DATA.customers[idx], ...rec}; updated++; }
        else { DATA.customers.push(rec); added++; }
      });
      saveData(); fileInput.value=''; render();
      alert(`Imported: ${added} added, ${updated} updated.`);
    }catch(err){ alert('Could not parse this CSV file.'); fileInput.value=''; }
  };
  reader.readAsText(file);
}
function importProductsCSV(fileInput){
  if(isStaff()) return;
  const file = fileInput.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const records = parseCSV(e.target.result);
      if(!records.length){ alert('No rows found in this CSV.'); fileInput.value=''; return; }
      let added=0, updated=0, skipped=0, stockAdjusted=0;
      const today = new Date().toISOString().slice(0,10);
      const nowIso = new Date().toISOString();
      records.forEach(r=>{
        const name = r.name || r.Name || r.Product || r['Product Name'] || r.product;
        if(!name){ skipped++; return; }
        const costPriceRaw = r.costPrice ?? r.CostPrice ?? r['Cost Price'];
        const sellingPriceRaw = r.sellingPrice ?? r.SellingPrice ?? r['Selling Price'] ?? r.Price ?? r.price;
        const onHandRaw = r.stockOnHand ?? r.StockOnHand ?? r['On Hand'] ?? r.OnHand;
        const reorderRaw = r.reorderLevel ?? r.ReorderLevel ?? r['Reorder At'] ?? r.ReorderAt;
        const rec = {
          name,
          colour: r.colour || r.Colour || r.color || r['Colour/Packing'] || r.Packing || '',
          type: r.type || r.Type || 'Other',
          costPrice: costPriceRaw!=null && costPriceRaw!=='' ? Number(costPriceRaw) : null,
          sellingPrice: sellingPriceRaw!=null && sellingPriceRaw!=='' ? (Number(sellingPriceRaw)||0) : 0,
          reorderLevel: reorderRaw!=null && reorderRaw!=='' ? (Number(reorderRaw)||10) : 10,
        };
        const idx = DATA.products.findIndex(p=>p.name===name);
        if(idx>=0){ DATA.products[idx] = {...DATA.products[idx], ...rec}; updated++; }
        else { DATA.products.push(rec); added++; }
        // The product table displays stock via productComputed(), which sums the
        // Restock Log for this product name — it does NOT read stockOnHand off the
        // product record. So to make an imported "On Hand" figure actually show up,
        // reconcile it here by pushing an adjustment restock entry for the difference.
        if(onHandRaw!=null && onHandRaw!==''){
          const targetOnHand = Number(onHandRaw)||0;
          const currentOnHand = productComputed(name).stockOnHand;
          const diff = targetOnHand - currentOnHand;
          if(diff !== 0){
            DATA.restocks.push({
              date: today,
              product: name,
              qty: diff,
              costPrice: null,
              supplier: null,
              consignmentId: 'CSV IMPORT ADJUSTMENT',
              notes: `Reconciled On Hand to CSV import (was ${currentOnHand}, set to ${targetOnHand})`,
              createdAt: nowIso
            });
            stockAdjusted++;
          }
        }
      });
      saveData(); fileInput.value=''; render();
      alert(`Imported: ${added} added, ${updated} updated, ${stockAdjusted} stock level(s) adjusted.` + (skipped ? ` ${skipped} row(s) skipped (no product name found).` : ''));
    }catch(err){ alert('Could not parse this CSV file.'); fileInput.value=''; }
  };
  reader.readAsText(file);
}

async function loadData(){
  await restoreLocalBackupFileHandle();
  if(!firebaseConfigured){
    const backup = loadLocalStorageBackup();
    DATA = backup ? backup.data : JSON.parse(JSON.stringify(SEED));
    resetUndoBaseline();
    render();
    alert(backup
      ? 'This CRM isn\'t connected to a shared database yet, so it loaded your most recent local backup from ' + new Date(backup.savedAt).toLocaleString() + ' instead. Changes will keep saving locally, but won\'t be shared with other devices.'
      : 'This CRM isn\'t connected to a shared database yet. Data entered now will only be saved locally on this PC/browser, not shared. Paste your Firebase Database URL into FIREBASE_DB_URL near the top of the script to fix this.');
    return;
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json${await authQuery()}`);
    if(!res.ok) throw new Error('Firebase request failed: ' + res.status);
    const json = await res.json();
    DATA = json || JSON.parse(JSON.stringify(SEED));
  }catch(e){
    console.error('load failed, checking local backup:', e);
    const backup = loadLocalStorageBackup();
    if(backup){
      DATA = backup.data;
      alert('Could not reach the shared database, so this loaded your most recent local backup from ' + new Date(backup.savedAt).toLocaleString() + ' instead. Changes will keep saving locally; reconnect to the internet and this will sync back to Firebase.');
    } else {
      DATA = JSON.parse(JSON.stringify(SEED));
      alert('Could not reach the shared database, and no local backup was found on this device, so nothing was loaded. Check your internet connection and reload. (Any changes you make now will not be saved.)');
    }
  }
  if(!Array.isArray(DATA.expectedRestocks)) DATA.expectedRestocks = [];
  if(!Array.isArray(DATA.payments)) DATA.payments = [];
  if(!DATA.crmUsers || typeof DATA.crmUsers!=='object') DATA.crmUsers = {};
  if(migrateLegacyPayments()) saveData();
  resetUndoBaseline();
  render();
}
// One-time, idempotent backfill: any order that already has amountPaid>0 but no matching
// entries in the payments ledger gets a single legacy payment logged on the order's date.
// This lets Finance's monthly cash report work correctly for historical orders too.
// Safe to call on every load — it only ever adds a payment for an order once.
function migrateLegacyPayments(){
  let added = false;
  DATA.orders.forEach(o=>{
    const paid = Number(o.amountPaid)||0;
    if(paid<=0) return;
    const hasLedgerEntry = DATA.payments.some(p=>p.orderId===o.orderId);
    if(hasLedgerEntry) return;
    DATA.payments.push({
      id: uid('PAY'), orderId: o.orderId, customer: o.customer||'',
      date: o.date || new Date().toISOString().slice(0,10),
      amount: paid, method: 'Legacy (migrated)',
      notes: 'Auto-created from this order\'s original Amount Paid value before the payment ledger existed.',
      createdAt: new Date().toISOString()
    });
    added = true;
  });
  return added;
}
function legacyMigratedPayments(){
  return (DATA.payments||[]).filter(p=>p.method==='Legacy (migrated)');
}
// One-click fix: the auto-migration that backfilled old orders into the payments ledger had no
// way to know how those orders were actually paid, so it labeled them "Legacy (migrated)" —
// which the Finance app can't credit to any Cash & Bank account. This lets the owner tell the
// CRM those old payments were (almost) all Mobile Money, so Finance's MTN Mobile Money account
// reflects them correctly.
async function reclassifyLegacyPayments(){
  if(isStaff()) return alert('Only the Owner can do this.');
  const legacy = legacyMigratedPayments();
  if(!legacy.length) return alert('No "Legacy (migrated)" payments found — nothing to fix.');
  const total = legacy.reduce((s,p)=>s+Number(p.amount||0),0);
  const ok = confirm(`Reclassify ${legacy.length} legacy payment(s) totaling ${fmtMoney(total)} as "Mobile Money"?\n\nThis updates the payment method on old pre-ledger orders so Finance credits them to the MTN Mobile Money account. Only do this if those old orders were indeed paid via MoMo.`);
  if(!ok) return;
  legacy.forEach(p=>{ p.method = 'Mobile Money'; });
  await saveData();
  alert('Done — those payments are now recorded as Mobile Money.');

let UNDO_STACK = [];
const UNDO_LIMIT = 20;
let PRE_MUTATION_SNAPSHOT = null;
function snapshotDataDeepClone(){ return JSON.parse(JSON.stringify(DATA)); }
function resetUndoBaseline(){

function updateUndoButtonState(){

  if(!btn) return;
  const n = UNDO_STACK.length;
  btn.disabled = n===0 || isStaff();

async function undoLastChange(){
  if(isStaff()) return;
  if(!UNDO_STACK.length){ alert('Nothing to undo yet — no changes recorded this session.'); return; }
  const stepsLeftAfter = UNDO_STACK.length - 1;
  if(!confirm(`Undo your last change?

This restores all data to how it was just before that change. (${stepsLeftAfter} more undo step${stepsLeftAfter===1?'':'s'} will still be available after this.)`)) return;
  DATA = UNDO_STACK.pop();
  PRE_MUTATION_SNAPSHOT = snapshotDataDeepClone();
  updateUndoButtonState();
  closeModal();
  render();
  await persistDataOnly();
}
async function persistDataOnly(){
  saveLocalStorageBackup();
  writeLocalBackupFile();
  if(!firebaseConfigured) return;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json${await authQuery()}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('Firebase save failed: ' + res.status);
  }catch(e){
    console.error('undo persist failed', e);
    alert('The undo was applied locally, but could not sync to the shared database. Reconnect to the internet and it will sync on your next change.');
  }
}

async function saveData(){
  // Undo bookkeeping: capture the state as it was just before this change.
  if(PRE_MUTATION_SNAPSHOT){
    UNDO_STACK.push(PRE_MUTATION_SNAPSHOT);
    if(UNDO_STACK.length>UNDO_LIMIT) UNDO_STACK.shift();
  }
  PRE_MUTATION_SNAPSHOT = snapshotDataDeepClone();
  updateUndoButtonState();

  // Always keep the local copies up to date first, regardless of what happens with Firebase.
  saveLocalStorageBackup();
  writeLocalBackupFile(); // fire-and-forget; failures are logged, not alerted

  if(!firebaseConfigured){
    console.warn('Firebase not configured — this save was only kept locally.');
    return;
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json${await authQuery()}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('Firebase save failed: ' + res.status);
  }catch(e){
    console.error('save failed', e);
    alert('Could not save to the shared database, so this change only saved locally on this PC for now. Reconnect to the internet and make another small edit to sync it back up — or use "Push Current Data to Firebase Now" in Data & Backup.');
  }
}

function getCustomerType(name){

function customerComputed(name){
  const orders = DATA.orders.filter(o=>o.customer===name);
  const totalOrders = orders.length;
  const totalSpent = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
  const dates = orders.map(o=>o.date).filter(Boolean).sort();
  const lastOrderDate = dates.length ? dates[dates.length-1] : null;
  let status = 'New';
  if(lastOrderDate){
    const days = (Date.now() - new Date(lastOrderDate).getTime())/86400000;
    status = days<=30 ? 'Active' : days<=90 ? 'At Risk' : 'Churned';
  }
  const followUps = DATA.interactions
    .map((f,idx)=>({...f, idx}))
    .filter(f=>f.customer===name && f.followUpDate && f.followUpDone!=='Yes')
    .sort((a,b)=>(a.followUpDate||'').localeCompare(b.followUpDate||''));
  const nextFollowUp = followUps.length ? followUps[0].followUpDate : null;
  const nextFollowUpIdx = followUps.length ? followUps[0].idx : null;
  return {totalOrders, totalSpent, lastOrderDate, status, nextFollowUp, nextFollowUpIdx};
}
function productComputed(name){
  const stockOnHand = DATA.restocks.filter(r=>r.product===name).reduce((s,r)=>s+(Number(r.qty)||0),0);
  const unitsSold = DATA.orderItems.filter(i=>i.product===name).reduce((s,i)=>s+(Number(i.qty)||0),0);
  const stockRemaining = stockOnHand - unitsSold;
  return {stockOnHand, unitsSold, stockRemaining};
}
function levenshteinDist(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function nameSimilarity(a, b){
  const la=(a||'').toLowerCase().trim(), lb=(b||'').toLowerCase().trim();
  const maxLen = Math.max(la.length, lb.length) || 1;
  return 1 - levenshteinDist(la, lb)/maxLen;
}
function guessProductMatch(name){
  let best=null, bestScore=-1;
  DATA.products.forEach(p=>{
    const s = nameSimilarity(name, p.name);
    if(s>bestScore){ bestScore=s; best=p.name; }
  });
  return {name: best, score: bestScore};
}
function scanProductNameMismatches(){
  const productNames = new Set(DATA.products.map(p=>p.name));
  const seen = {};
  DATA.orderItems.forEach(oi=>{
    if(!oi.product || productNames.has(oi.product)) return;
    seen[oi.product] = seen[oi.product] || {qty:0, restocks:0};
    seen[oi.product].qty += Number(oi.qty)||0;
  });
  DATA.restocks.forEach(r=>{
    if(!r.product || productNames.has(r.product)) return;
    seen[r.product] = seen[r.product] || {qty:0, restocks:0};
    seen[r.product].restocks += 1;
  });
  return Object.keys(seen).sort().map(name=>{
    const guess = guessProductMatch(name);
    return { name, qty: seen[name].qty, restocks: seen[name].restocks, guessName: guess.score>0.4 ? guess.name : '', guessScore: guess.score };
  });
}

function applyProductRenames(count){

function mondayOf(d){

let currentTrendPoints = [];
function renderTrendChartSVG(series){
  const w = 700, h = 220, padL = 44, padR = 12, padT = 16, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const max = Math.max(1, ...series.map(s=>s.revenue));
  const stepX = series.length>1 ? plotW/(series.length-1) : plotW;
  const pts = series.map((s,i)=>{
    const x = padL + i*stepX;
    const y = padT + plotH - (s.revenue/max)*plotH;
    return {x,y,...s};
  });
  currentTrendPoints = pts;
  const linePath = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${pts[pts.length-1].x.toFixed(1)},${padT+plotH} L${pts[0].x.toFixed(1)},${padT+plotH} Z`;
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="0.35"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted)">${fmtMoneyShort(f*max)}</text>`;
  }).join('');
  const xLabels = pts.map((p,i)=>{
    if(series.length>8 && i%2!==0 && i!==series.length-1) return '';
    return `<text x="${p.x.toFixed(1)}" y="${h-10}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${p.label}</text>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--gold-bright)"/>`).join('');
  return `<svg id="trendSvg" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--gold-bright)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--gold-bright)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#trendFill)"/>
    <path d="${linePath}" fill="none" stroke="var(--gold-bright)" stroke-width="2"/>
    ${dots}
    ${xLabels}
    <line id="trendGuideLine" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="var(--gold-bright)" stroke-width="1" stroke-dasharray="3,3" opacity="0" pointer-events="none"/>
    <circle id="trendGuideDot" r="4.5" fill="var(--gold-bright)" stroke="var(--surface)" stroke-width="1.5" opacity="0" pointer-events="none"/>
    <g id="trendTooltipGroup" opacity="0" pointer-events="none">
      <rect id="trendTooltipBg" width="96" height="34" rx="6" fill="var(--surface-2)" stroke="var(--gold)" stroke-width="1"/>
      <text id="trendTooltipMonth" font-size="9" fill="var(--text-muted)"></text>
      <text id="trendTooltipAmount" font-size="12" font-weight="700" fill="var(--gold-bright)"></text>
    </g>
    <rect id="trendOverlay" x="${padL}" y="0" width="${plotW}" height="${h}" fill="transparent" style="cursor:crosshair;"/>
  </svg>`;
}
function attachTrendChartInteractivity(){
  const svg = document.getElementById('trendSvg');
  const overlay = document.getElementById('trendOverlay');
  if(!svg || !overlay || !currentTrendPoints.length) return;
  const guideLine = document.getElementById('trendGuideLine');
  const guideDot = document.getElementById('trendGuideDot');
  const tooltipG = document.getElementById('trendTooltipGroup');
  const tooltipBg = document.getElementById('trendTooltipBg');
  const tMonth = document.getElementById('trendTooltipMonth');
  const tAmount = document.getElementById('trendTooltipAmount');
  const w = 700, h = 220;

  function svgX(evt){
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    return ((clientX - rect.left) / rect.width) * w;
  }
  function nearest(x){
    let best = currentTrendPoints[0], bestD = Infinity;
    currentTrendPoints.forEach(p=>{ const d = Math.abs(p.x-x); if(d<bestD){ bestD=d; best=p; } });
    return best;
  }
  function show(evt){
    const p = nearest(svgX(evt));
    guideLine.setAttribute('x1', p.x); guideLine.setAttribute('x2', p.x); guideLine.setAttribute('opacity','1');
    guideDot.setAttribute('cx', p.x); guideDot.setAttribute('cy', p.y); guideDot.setAttribute('opacity','1');
    tMonth.textContent = p.label;
    tAmount.textContent = fmtMoney(p.revenue);
    const boxW = 96, boxH = 34;
    let bx = p.x + 10; if(bx + boxW > w-6) bx = p.x - boxW - 10;
    let by = p.y - boxH - 8; if(by < 2) by = p.y + 10;
    tooltipBg.setAttribute('x', bx); tooltipBg.setAttribute('y', by);
    tMonth.setAttribute('x', bx+8); tMonth.setAttribute('y', by+13);
    tAmount.setAttribute('x', bx+8); tAmount.setAttribute('y', by+27);
    tooltipG.setAttribute('opacity','1');
  }
  function hide(){
    guideLine.setAttribute('opacity','0');
    guideDot.setAttribute('opacity','0');
    tooltipG.setAttribute('opacity','0');
  }
  overlay.addEventListener('mousemove', show);
  overlay.addEventListener('mouseleave', hide);
  overlay.addEventListener('touchmove', e=>{ show(e); e.preventDefault(); }, {passive:false});
  overlay.addEventListener('touchend', hide);
}

// Revenue recognized on an order = money actually collected (amountPaid), clamped to [0, total].
// This is what counts toward "Revenue" everywhere in the dashboard; whatever's left (balance)
// is tracked separately as Outstanding and never counted as revenue until it's actually paid.
function orderRevenue(o){
  const total = Number(o.total)||0;
  const paidRaw = Number(o.amountPaid)||0;
  if(paidRaw<=0) return 0;
  return total>0 ? Math.min(paidRaw, total) : paidRaw;
}

/* ---------- payment ledger ---------- */
// Each entry: {id, orderId, customer, date, amount, method, notes, createdAt}
// order.amountPaid / order.balance / order.paymentStatus are always derived FROM this ledger
// (recomputeOrderPaymentState), so the ledger is the single source of truth for how much
// has been paid and when — that "when" is what lets Finance report cash collected by the
// actual payment date instead of the order date.
function orderPayments(orderId){
  return (DATA.payments||[]).filter(p=>p.orderId===orderId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function recomputeOrderPaymentState(o){
  const cashPaid = orderPayments(o.orderId).reduce((s,p)=>s+Number(p.amount||0),0);
  const creditApplied = appliedCreditForOrder(o.orderId);
  const paid = cashPaid + creditApplied;
  const total = Number(o.total)||0;
  o.amountPaid = paid;
  o.balance = Math.max(0, total-paid);
  if(o.paymentStatus!=='Refunded'){
    if(paid<=0) o.paymentStatus = 'Not Paid';
    else if(total>0 && paid>=total) o.paymentStatus = 'Fully Paid';
    else o.paymentStatus = 'Partially Paid';
  }
  reconcileOrderCredit(o, cashPaid);
}
/* ---------- customer store credit ---------- */
// Each entry: {id, customer, date, amount, type:'overpayment'|'applied'|'manual', sourceOrderId, appliedOrderId, notes, createdAt}
// Sign convention: 'overpayment' and positive 'manual' entries ADD to the customer's balance;
// 'applied' entries are stored as NEGATIVE amounts (credit spent), so summing all entries for a
// customer always gives their current available balance. Kept separate from DATA.payments so
// Finance's cash-collected totals are never affected by credit being redeemed — no new cash
// changes hands when a customer uses store credit, it's a reallocation of cash already counted
// when the original overpayment happened.
function customerCreditBalance(customer){
  return (DATA.creditLedger||[]).filter(c=>c.customer===customer).reduce((s,c)=>s+Number(c.amount||0),0);
}
function appliedCreditForOrder(orderId){
  return -((DATA.creditLedger||[]).filter(c=>c.type==='applied'&&c.appliedOrderId===orderId).reduce((s,c)=>s+Number(c.amount||0),0));
}
function creditHistory(customer){
  return (DATA.creditLedger||[]).filter(c=>c.customer===customer).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
// Auto-creates/updates/removes a single 'overpayment' credit entry tied to this order, based on
// how much cash has been paid on it beyond what's still owed after any credit already applied.
function reconcileOrderCredit(o, cashPaid){
  DATA.creditLedger = DATA.creditLedger || [];
  const total = Number(o.total)||0;
  const creditApplied = appliedCreditForOrder(o.orderId);
  const remainingAfterCredit = Math.max(0, total-creditApplied);
  const overpay = +(Math.max(0, cashPaid-remainingAfterCredit)).toFixed(2);
  const existing = DATA.creditLedger.find(c=>c.sourceOrderId===o.orderId && c.type==='overpayment');
  if(overpay<=0.004){
    if(existing) DATA.creditLedger = DATA.creditLedger.filter(c=>c!==existing);
    return;
  }
  if(existing){ existing.amount = overpay; existing.customer = o.customer||existing.customer; }
  else{
    DATA.creditLedger.push({id:uid('CR'), customer:o.customer||'', date:o.date||new Date().toISOString().slice(0,10), amount:overpay, type:'overpayment', sourceOrderId:o.orderId, appliedOrderId:null, notes:'Auto-generated: cash paid on '+o.orderId+' exceeded what was owed on it.', createdAt:new Date().toISOString()});
  }
}
// Applies up to `amount` of a customer's available credit to an order, capped sensibly.
function applyCreditToOrder(orderId, amount){
  if(isStaff()) return;
  const o = DATA.orders.find(x=>x.orderId===orderId);
  if(!o) return;
  const available = customerCreditBalance(o.customer);
  const cap = Math.min(available, o.balance);
  const amt = +(Math.max(0, Math.min(Number(amount)||0, cap))).toFixed(2);
  if(amt<=0.004){ alert(cap<=0.004 ? 'No credit available to apply here.' : 'Enter a valid amount.'); return; }
  DATA.creditLedger = DATA.creditLedger || [];
  DATA.creditLedger.push({id:uid('CR'), customer:o.customer||'', date:new Date().toISOString().slice(0,10), amount:-amt, type:'applied', sourceOrderId:null, appliedOrderId:orderId, notes:'Applied to '+orderId, createdAt:new Date().toISOString()});
  recomputeOrderPaymentState(o);
  saveData(); closeModal(); render();
}

function deletePayment(paymentId, orderId){
  if(isStaff()) return;

  DATA.payments = DATA.payments.filter(p=>p.id!==paymentId);
  const o = DATA.orders.find(x=>x.orderId===orderId);
  if(o) recomputeOrderPaymentState(o);
  saveData();
  if(o) openRecordPaymentModal(orderId); else { closeModal(); render(); }
}

function outstandingByCustomer(){
  const map = {};
  DATA.orders.forEach(o=>{

function ordersForDashScope(scope){
  if(scope==='month') return DATA.orders.filter(o=>{
    if(!o.date) return false;
    const d = new Date(o.date);
    return (d.getMonth()+1)===dashMonth && d.getFullYear()===dashYear;
  });
  if(scope==='week'){
    const {start,end} = weekRange(dashWeekStart);
    return DATA.orders.filter(o=>{
      if(!o.date) return false;
      const d = new Date(o.date);
      return d>=start && d<=end;
    });
  }
  return DATA.orders.slice();
}

function productProfitBreakdown(month, year){
  const map = {};
  const items = (month!=null && year!=null) ? DATA.orderItems.filter(it=>{
    if(!it.orderDate) return false;
    const d = new Date(it.orderDate);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  }) : DATA.orderItems;
  items.forEach(it=>{
    const prod = DATA.products.find(p=>p.name===it.product);
    if(prod && prod.costPrice!=null){
      const profit = ((Number(it.unitPrice)||0) - Number(prod.costPrice)) * (Number(it.qty)||0);
      map[it.product] = (map[it.product]||0) + profit;
    }
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function avgOrderValue(month, year){
  const orders = (month!=null && year!=null) ? DATA.orders.filter(o=>{
    if(!o.date) return false;
    const d = new Date(o.date);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  }) : DATA.orders;
  if(!orders.length) return 0;
  const total = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
  return total/orders.length;
}
function grossProfit(month, year){
  let profit = 0;
  const items = (month!=null && year!=null) ? DATA.orderItems.filter(it=>{
    if(!it.orderDate) return false;
    const d = new Date(it.orderDate);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  }) : DATA.orderItems;
  items.forEach(it=>{
    const prod = DATA.products.find(p=>p.name===it.product);
    if(prod && prod.costPrice!=null){
      profit += ((Number(it.unitPrice)||0) - Number(prod.costPrice)) * (Number(it.qty)||0);
    }
  });
  return profit;
}
function leadConversionRate(month, year){
  const leads = (month!=null && year!=null) ? DATA.leads.filter(l=>{
    if(!l.dateAdded) return false;
    const d = new Date(l.dateAdded);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  }) : DATA.leads;
  if(!leads.length) return null;
  const converted = leads.filter(l=>l.status==='Converted').length;
  return (converted/leads.length)*100;
}
function repeatCustomerRate(month, year){
  let names;
  if(month!=null && year!=null){
    const namesSet = new Set();
    DATA.orders.forEach(o=>{
      if(!o.date) return;
      const d = new Date(o.date);
      if((d.getMonth()+1)===month && d.getFullYear()===year && o.customer) namesSet.add(o.customer);
    });
    names = [...namesSet];
  } else {
    names = allCustomerNames();
  }
  if(!names.length) return null;
  const repeat = names.filter(n=>customerComputed(n).totalOrders>1).length;
  return (repeat/names.length)*100;
}
function newLeadsInMonth(month, year){
  return DATA.leads.filter(l=>{
    if(!l.dateAdded) return false;
    const d = new Date(l.dateAdded);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  });
}
function inventoryValue(){
  return DATA.products.reduce((s,p)=>{
    const {stockRemaining} = productComputed(p.name);
    if(typeof stockRemaining !== 'number' || stockRemaining<=0) return s;
    const cost = p.costPrice!=null ? Number(p.costPrice) : Number(p.sellingPrice)||0;
    return s + stockRemaining*cost;
  },0);
}
const SALE_CHANNELS = ['TikTok Live','IG/WhatsApp DM','Marketplace Table','Salon/Bulk Order','Other'];
function salesByChannel(){
  const map = {};
  SALE_CHANNELS.forEach(c=>map[c]=0);
  DATA.orders.forEach(o=>{
    const ch = o.channel && SALE_CHANNELS.includes(o.channel) ? o.channel : 'Other';
    map[ch] = (map[ch]||0) + orderRevenue(o);
  });
  return Object.entries(map).filter(([,rev])=>rev>0).sort((a,b)=>b[1]-a[1]);
}
function topProducts(n){
  // Payment status lives at the order level, not per line item, so each line's
  // recognized revenue is its share of lineTotal scaled by how much of that
  // order has actually been paid (paid/total). Fully paid orders => full lineTotal;
  // unpaid orders => 0; partially paid orders => the paid fraction of each line.
  const orderById = {};
  DATA.orders.forEach(o=>{ orderById[o.orderId] = o; });
  const map = {};
  DATA.orderItems.forEach(it=>{
    const lineTotal = Number(it.lineTotal)!=null ? Number(it.lineTotal) : (Number(it.qty)||0)*(Number(it.unitPrice)||0);
    const order = orderById[it.orderId];
    let recognized = 0;
    if(order){
      const total = Number(order.total)||0;
      const paid = orderRevenue(order);
      recognized = total>0 ? lineTotal*(paid/total) : 0;
    }
    map[it.product] = (map[it.product]||0) + recognized;
  });
  return Object.entries(map).filter(([,rev])=>rev>0).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
function topCustomersBySpend(n){
  return allCustomerNames()
    .map(name=>({name, ...customerComputed(name)}))
    .filter(c=>c.totalSpent>0)
    .sort((a,b)=>b.totalSpent-a.totalSpent)
    .slice(0,n);
}
function allCustomerNames(){
  const fromOrders = DATA.orders.map(o=>o.customer);
  const fromList = DATA.customers.map(c=>c.name);
  return Array.from(new Set([...fromList, ...fromOrders])).filter(Boolean);
}
function allNamesIncludingLeads(){
  return Array.from(new Set([...allCustomerNames(), ...DATA.leads.map(l=>l.name)])).filter(Boolean);
}

function saveOrder(orderId){
  if(isStaff() && orderId) return;
  const customer = document.getElementById('o_customer').value.trim();
  if(!customer){ alert('Customer is required.'); return; }
  const newId = document.getElementById('o_orderid').value.trim();
  if(!newId){ alert('Order ID is required.'); return; }
  const clash = DATA.orders.find(o=>o.orderId===newId && o.orderId!==orderId);
  if(clash){ alert(`Order ID "${newId}" is already used by another order. Pick a different one.`); return; }
  const date = document.getElementById('o_date').value;
  const paid = Number(document.getElementById('o_paid').value)||0;
  const paymentStatus = document.getElementById('o_payment').value;
  const orderStatus = document.getElementById('o_status').value;
  const channel = document.getElementById('o_channel').value;

  const itemEls = document.querySelectorAll('#itemsEditor .item-row');
  let total = 0;
  const id = newId;
  const items = [];
  let lineNum = 1;
  itemEls.forEach(row=>{
    const product = row.querySelector('.it-product').value.trim();
    const colour = row.querySelector('.it-colour').value.trim();
    const qty = Number(row.querySelector('.it-qty').value)||0;
    const price = Number(row.querySelector('.it-price').value)||0;
    if(!product || !qty) return;
    const lineTotal = qty*price;
    total += lineTotal;
    items.push({orderId:id, product, colour, qty, unitPrice:price, lineTotal, orderDate:date, lineNum, matchKey:`${id}|${lineNum}`});
    lineNum++;
  });
  if(!items.length){ alert('Add at least one item.'); return; }

  if(orderId){
    const idx = DATA.orders.findIndex(o=>o.orderId===orderId);
    if(idx>=0){
      const existing = DATA.orders[idx];
      const currentLedgerPaid = orderPayments(orderId).reduce((s,p)=>s+Number(p.amount||0),0);
      const diff = paid - currentLedgerPaid - appliedCreditForOrder(orderId);
      // orderId may have changed (renamed) — repoint existing ledger entries first, then log the diff.
      if(id!==orderId) DATA.payments.forEach(p=>{ if(p.orderId===orderId) p.orderId=id; });
      if(Math.abs(diff)>0.001){
        DATA.payments.push({id:uid('PAY'), orderId:id, customer, date:new Date().toISOString().slice(0,10), amount:diff, method:'Adjustment', notes:'Edited via order form Amount Paid field.', createdAt:new Date().toISOString()});
      }
      DATA.orders[idx] = {...existing, orderId:id, date, customer, total, orderStatus, channel};
      recomputeOrderPaymentState(DATA.orders[idx]);
      if(paymentStatus==='Refunded') DATA.orders[idx].paymentStatus = 'Refunded';
    }
    DATA.orderItems = DATA.orderItems.filter(i=>i.orderId!==orderId);
    DATA.orderItems.push(...items);
  }else{
    const newOrder = {
      orderId:id, date, customer, phone:'', total, amountPaid:0, balance: total,
      paymentStatus:'Not Paid', orderStatus, channel, deliveryDate:null, createdAt:new Date().toISOString()
    };
    if(paid>0){
      const method = document.getElementById('o_paidMethod')?.value || 'Cash';
      DATA.payments.push({id:uid('PAY'), orderId:id, customer, date, amount:paid, method, notes:'Logged at order creation.', createdAt:new Date().toISOString()});
    }
    recomputeOrderPaymentState(newOrder);
    DATA.orders.push(newOrder);
    DATA.orderItems.push(...items);
    const applyAmt = Number(document.getElementById('o_applyCredit')?.value)||0;
    if(applyAmt>0.004){
      const available = customerCreditBalance(customer);
      const capped = +(Math.max(0, Math.min(applyAmt, available, newOrder.balance))).toFixed(2);
      if(capped>0.004){
        DATA.creditLedger = DATA.creditLedger || [];
        DATA.creditLedger.push({id:uid('CR'), customer, date, amount:-capped, type:'applied', sourceOrderId:null, appliedOrderId:newOrder.orderId, notes:'Applied at order creation.', createdAt:new Date().toISOString()});
        recomputeOrderPaymentState(newOrder);
      }
    }
    if(paid>0 && paymentStatus==='Refunded') newOrder.paymentStatus='Refunded';
  }

  // if this was a lead, mark it converted (remember prior status so we can revert if the order is later deleted)
  const lead = DATA.leads.find(l=>l.name===customer);
  if(lead && lead.status !== 'Converted'){
    lead._preConvertStatus = lead.status;
    lead.status = 'Converted';
    syncCustomerPhoneFromLead(customer);
  }

  saveData(); closeModal(); render();
}
function deleteOrder(orderId){
  if(isStaff()) return;
  if(!confirm(`Delete order ${orderId}? This also removes its line items.`)) return;
  const deletedOrder = DATA.orders.find(o=>o.orderId===orderId);
  DATA.orders = DATA.orders.filter(o=>o.orderId!==orderId);
  DATA.orderItems = DATA.orderItems.filter(i=>i.orderId!==orderId);
  DATA.payments = (DATA.payments||[]).filter(p=>p.orderId!==orderId);
  DATA.creditLedger = (DATA.creditLedger||[]).filter(c=>c.sourceOrderId!==orderId && c.appliedOrderId!==orderId);

  // if that customer has no other orders left, un-convert their lead back to its pre-conversion status
  if(deletedOrder){
    const stillHasOrders = DATA.orders.some(o=>o.customer===deletedOrder.customer);
    if(!stillHasOrders){
      const lead = DATA.leads.find(l=>l.name===deletedOrder.customer);
      if(lead && lead.status==='Converted'){
        lead.status = lead._preConvertStatus || 'New';
        delete lead._preConvertStatus;
      }
    }
  }

  saveData(); closeModal(); render();
}
