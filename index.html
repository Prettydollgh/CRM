<style>
  :root{
    --bg:#FBF7F1;
    --surface:#FFFFFF;
    --surface-2:#F3EBE1;
    --border:#E3D6C5;
    --gold:#7A2E3A;
    --gold-bright:#93404F;
    --text:#2B2420;
    --text-muted:#8A7C6E;
    --green:#3F7A5B;
    --amber:#A8672A;
    --red:#A23B3B;
    --btn-text:#FBF7F1;
    --radius:12px;
    --ease:cubic-bezier(.22,.8,.28,1);
    --shadow-sm:0 2px 10px rgba(60,40,20,.06);
    --shadow-md:0 10px 32px rgba(60,40,20,.10);
    --shadow-gold:0 0 0 1px rgba(122,46,58,.10), 0 8px 20px rgba(122,46,58,.05);
  }
  :root.theme-dark{
    --bg:#1C1512;
    --surface:#251C17;
    --surface-2:#2F241D;
    --border:#4A3A2E;
    --gold:#C97C8B;
    --gold-bright:#E3A2AE;
    --text:#F5ECE4;
    --text-muted:#B3A395;
    --green:#6FAE8B;
    --amber:#D89A5A;
    --red:#E08A8A;
    --btn-text:#241419;
    --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    --shadow-md:0 10px 32px rgba(0,0,0,.5);
    --shadow-gold:0 0 0 1px rgba(201,124,139,.16), 0 8px 20px rgba(201,124,139,.08);
  }
  *{box-sizing:border-box;}
  html{scrollbar-color:var(--border) transparent;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-bright);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes softPulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:.7;transform:scale(1.06);}}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .app{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:linear-gradient(180deg,#F7F0E7,#EFE4D5);
    border-right:1px solid var(--border);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:28px;
    box-shadow:var(--shadow-sm);
    position:relative;
    z-index:1;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
  .brand-ring{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;flex-shrink:0;
    background:var(--surface);
    box-shadow:0 0 0 1px var(--border);
  }
  .brand-ring img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-name{font-family:'Playfair Display',serif;font-size:15.5px;letter-spacing:0.06em;color:var(--gold-bright);line-height:1.15;}
  .brand-sub{font-size:9.5px;letter-spacing:0.22em;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}

  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    color:var(--text-muted);font-size:13.5px;font-weight:500;
    transition:background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), padding-left .2s var(--ease);
    user-select:none;
    border-left:2px solid transparent;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);padding-left:15px;}
  .nav-item.active{background:var(--surface-2);color:var(--gold-bright);border-left-color:var(--gold);}
  .nav-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;transition:opacity .2s var(--ease),transform .2s var(--ease);}
  .nav-item.active .nav-dot{opacity:1;transform:scale(1.3);}

  .sidebar-foot{margin-top:auto;font-size:10.5px;color:var(--text-muted);line-height:1.5;padding:0 4px;}

  /* ---- Main ---- */
  main{flex:1;padding:34px 42px 60px;max-width:1280px;}
  #main{animation:fadeSlideIn .4s var(--ease);}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;letter-spacing:.01em;}
  .page-sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
  .btn{
    background:var(--gold);color:var(--btn-text);border:none;padding:9px 16px;border-radius:7px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    transition:background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
  }
  .btn:hover{background:var(--gold-bright);transform:translateY(-1px);box-shadow:0 6px 16px rgba(122,46,58,.18);}
  .btn:active{transform:scale(0.97);}
  .btn-ghost{
    background:transparent;color:var(--text-muted);border:1px solid var(--border);
    padding:8px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--gold);transform:translateY(-1px);}
  .btn-ghost:active{transform:scale(0.97);}

  /* ---- Stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:30px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;position:relative;overflow:hidden;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    animation:fadeSlideIn .45s var(--ease) backwards;
  }
  .stat-grid .stat-card:nth-child(1){animation-delay:.02s;}
  .stat-grid .stat-card:nth-child(2){animation-delay:.05s;}
  .stat-grid .stat-card:nth-child(3){animation-delay:.08s;}
  .stat-grid .stat-card:nth-child(4){animation-delay:.11s;}
  .stat-grid .stat-card:nth-child(5){animation-delay:.14s;}
  .stat-grid .stat-card:nth-child(6){animation-delay:.17s;}
  .stat-grid .stat-card:nth-child(7){animation-delay:.2s;}
  .stat-grid .stat-card:nth-child(8){animation-delay:.23s;}
  .stat-grid .stat-card:nth-child(9){animation-delay:.26s;}
  .stat-grid .stat-card:nth-child(10){animation-delay:.29s;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(122,46,58,.3);}
  .stat-card::before{
    content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;
    border:1px solid rgba(122,46,58,0.10);transition:transform .4s var(--ease);
  }
  .stat-card:hover::before{transform:scale(1.15);}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .stat-value{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--text);transition:color .2s var(--ease);}
  .stat-value.warn{color:var(--amber);}
  .stat-value.danger{color:var(--red);}
  .stat-value.good{color:var(--green);}

  /* ---- Selector row (month/year, invoice-style) ---- */
  .selector-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);}
  select,input,textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;outline:none;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(122,46,58,.12);}

  /* ---- Progress bar ---- */
  .progress-wrap{margin-top:6px;}
  .progress-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:99px;transition:width .6s var(--ease);}
  .progress-label{font-size:11.5px;color:var(--text-muted);margin-top:6px;}

  /* ---- Tables ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow-sm);transition:box-shadow .25s var(--ease);}
  .card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .trend-chart{padding:16px 20px 8px;}
  .trend-chart svg{display:block;}
  body.role-staff .owner-only, body.role-staff .icon-btn{display:none !important;}
  .card-head h3{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;margin:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
     padding:10px 20px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;
     position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--border);}
  td{padding:11px 20px;border-bottom:1px solid rgba(180,150,110,0.3);color:var(--text);white-space:nowrap;}
  tbody tr{transition:background .15s var(--ease);}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--text-muted);font-style:italic;text-align:center;padding:26px;}
  .time-stamp{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;letter-spacing:.02em;}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;transition:transform .15s var(--ease);}
  .badge.active,.badge.ok,.badge.converted,.badge.yes,.badge.fully-paid,.badge.delivered{background:rgba(63,122,91,.14);color:var(--green);}
  .badge.at-risk,.badge.new,.badge.partially-paid,.badge.order-received,.badge.no{background:rgba(168,103,42,.14);color:var(--amber);}
  .badge.churned,.badge.low-stock,.badge.not-paid,.badge.lost{background:rgba(162,59,59,.14);color:var(--red);}

  .table-scroll{overflow:auto;max-height:min(64vh,620px);}
  .onhand-input{width:64px;padding:5px 8px;text-align:right;font-size:13px;}
  .sort-th{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:3px;transition:color .15s var(--ease);}
  .sort-th:hover{color:var(--gold-bright);}
  .toolbar-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow-sm);}
  .toolbar-row .field{min-width:220px;flex:1;}
  .toolbar-row .field input{width:100%;}
  .toolbar-spacer{flex:1 1 auto;}
  .cust-link{color:var(--gold-bright);cursor:pointer;font-weight:600;text-decoration:none;}
  .cust-link:hover{text-decoration:underline;}
  .timeline-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(180,150,110,0.3);}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .timeline-dot.order{background:var(--gold);}
  .timeline-dot.interaction{background:var(--green);}
  .timeline-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;}
  .timeline-date{margin-left:auto;font-size:11.5px;color:var(--text-muted);}
  .timeline-body{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
  .data-block{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .data-block .hint{color:var(--text-muted);font-size:13px;line-height:1.5;}
  .data-block .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .data-block code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px;color:var(--gold-bright);}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    padding:5px 10px;border-radius:6px;font-size:11.5px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease);
  }
  .icon-btn:hover{color:var(--text);border-color:var(--gold);transform:translateY(-1px);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,8,5,0.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
    opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s linear .22s;
  }
  .modal-backdrop.show{opacity:1;visibility:visible;transition:opacity .22s var(--ease);}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:26px 28px;
    box-shadow:var(--shadow-md);
    transform:scale(.94) translateY(8px);opacity:0;
    transition:transform .28s var(--ease),opacity .22s var(--ease);
  }
  .modal-backdrop.show .modal{transform:scale(1) translateY(0);opacity:1;}
  .modal h3{font-family:'Playfair Display',serif;font-size:19px;margin:0 0 18px;}
  .form-grid{display:flex;flex-direction:column;gap:14px;}
  .form-grid label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  .items-editor{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-2);}
  .item-row{display:grid;grid-template-columns:1fr 110px 60px 80px auto;gap:8px;margin-bottom:8px;align-items:center;}
  .item-row input{width:100%;}
  .it-product-wrap{display:flex;gap:4px;align-items:center;}
  .it-product-wrap .it-product{flex:1;min-width:0;}
  .it-browse-btn{flex:0 0 auto;padding:6px 8px;font-size:13px;line-height:1;}
  .product-picker-panel{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md,0 8px 24px rgba(0,0,0,.18));width:320px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;overflow:hidden;}
  .product-picker-panel input{width:100%;box-sizing:border-box;border:none;border-bottom:1px solid var(--border);padding:10px 12px;font-size:13px;background:transparent;color:inherit;}
  .product-picker-panel input:focus{outline:none;}
  .product-picker-list{max-height:260px;overflow-y:auto;}
  .product-picker-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(180,150,110,0.15);}
  .product-picker-item:last-child{border-bottom:none;}
  .product-picker-item:hover, .product-picker-item.active{background:rgba(122,46,58,.08);}
  .product-picker-item .pp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .product-picker-item .pp-price{color:var(--text-muted);font-size:12px;white-space:nowrap;}
  .product-picker-empty{padding:12px;font-size:12.5px;color:var(--text-muted);text-align:center;}
  .remove-item{cursor:pointer;color:var(--red);font-size:16px;background:none;border:none;padding:2px 6px;transition:transform .15s var(--ease);}
  .remove-item:hover{transform:scale(1.2);}
  .add-item-btn{font-size:12px;color:var(--gold);background:none;border:1px dashed var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;width:100%;margin-top:4px;transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease);}
  .add-item-btn:hover{border-color:var(--gold);background:rgba(122,46,58,.05);}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
    nav{flex-direction:row;}
    .sidebar-foot{display:none;}
    main{padding:22px;}
  }
  ::selection{background:rgba(122,46,58,.18);}

  /* ---- Invoice ---- */
  .invoice-toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-sm);}
  .invoice-toolbar select{min-width:260px;}
  .invoice-paper{
    background:#ffffff;color:#1a1410;border-radius:10px;
    padding:34px 40px;max-width:820px;margin:0 auto;
    box-shadow:0 6px 30px rgba(0,0,0,.35);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #7A2E3A;padding-bottom:16px;margin-bottom:18px;}
  .inv-brand{display:flex;gap:14px;align-items:center;}
  .inv-logo{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#0c0906;}
  .inv-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .inv-co-name{font-family:'Playfair Display',serif;font-weight:700;font-size:20px;letter-spacing:.03em;color:#1a1410;}
  .inv-co-sub{font-size:11.5px;color:#54432a;margin-top:2px;font-weight:500;}
  .inv-co-contact{font-size:11px;color:#54432a;margin-top:6px;font-weight:500;}
  .inv-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#7A2E3A;letter-spacing:.08em;text-align:right;}
  .inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px;}
  .inv-block h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a6b1f;margin:0 0 8px;font-weight:700;}
  .inv-block .row{font-size:13.5px;margin-bottom:4px;color:#1a1410;font-weight:500;}
  .inv-block .row b{color:#1a1410;font-weight:700;}
  .inv-pay-badge{display:inline-block;margin-top:2px;padding:4px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.04em;}
  .inv-pay-badge.not-paid{background:#f3d9d4;color:#9a2e20;}
  .inv-pay-badge.partially-paid,.inv-pay-badge.deposit-paid{background:#f6e3c4;color:#8a5a0d;}
  .inv-pay-badge.fully-paid{background:#d9ecd6;color:#2e6b28;}
  .inv-pay-badge.refunded{background:#e2e2e2;color:#444;}
  table.inv-items{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
  table.inv-items th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a6b1f;border-bottom:1.5px solid #7A2E3A;padding:8px 6px;font-weight:700;}
  table.inv-items td{padding:7px 6px;border-bottom:1px solid #e5dcc4;color:#1a1410;font-weight:500;}
  table.inv-items td.num,table.inv-items th.num{text-align:right;}
  .inv-totals{margin-left:auto;width:280px;font-size:13.5px;}
  .inv-totals .t-row{display:flex;justify-content:space-between;padding:5px 0;color:#1a1410;font-weight:500;}
  .inv-totals .t-row input{width:90px;text-align:right;background:#fff;border:1px solid #c9a24b;color:#1a1410;padding:4px 6px;border-radius:5px;font-size:13px;font-weight:600;}
  .inv-totals .t-row.due{font-weight:800;font-size:15.5px;border-top:1.5px solid #7A2E3A;margin-top:6px;padding-top:8px;color:#1a1410;}
  .inv-totals .t-row.balance{font-weight:800;color:#9a2e20;}
  .inv-footer{margin-top:20px;border-top:1px solid #e5dcc4;padding-top:14px;font-size:11.5px;color:#54432a;font-weight:500;}
  .inv-footer .thanks{margin-top:8px;font-family:'Playfair Display',serif;font-style:italic;color:#7A2E3A;font-size:13.5px;font-weight:600;}
  .invoice-actions{max-width:820px;margin:0 auto 16px;display:flex;justify-content:flex-end;gap:10px;}

  @page{margin:10mm;}
  @media print{
    body *{visibility:hidden;}
    .invoice-paper, .invoice-paper *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .invoice-paper{position:absolute;top:0;left:0;box-shadow:none;max-width:100%;padding:0;border-radius:0;}
    .sidebar,.page-head,.invoice-toolbar,.invoice-actions{display:none!important;}
  }

  /* ---- Login screen ---- */
  .brand-ring{cursor:zoom-in;}
  .login-logo{cursor:zoom-in;}
  #logoLightbox{
    position:fixed;inset:0;background:rgba(5,3,1,0.88);z-index:200;
    display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  }
  #logoLightbox.show{display:flex;}
  #logoLightbox img{
    max-width:min(80vw,480px);max-height:80vh;width:100%;border-radius:50%;
    box-shadow:0 0 0 4px var(--gold),0 0 60px rgba(0,0,0,.6);
    object-fit:cover;aspect-ratio:1/1;
  }

  #loginScreen{
    position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#FFFDFB,#F1E4D6 75%);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .login-card{
    width:100%;max-width:340px;text-align:center;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:38px 32px 32px;
    box-shadow:var(--shadow-md);
    animation:popIn .5s var(--ease);
  }
  .login-logo{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;overflow:hidden;box-shadow:0 0 0 1px var(--border);}
  .login-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .login-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-bright);letter-spacing:.04em;}
  .login-sub{font-size:11.5px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;margin-bottom:26px;}
  .login-card input{width:100%;text-align:center;margin-bottom:12px;letter-spacing:.15em;}
  .login-card .btn{width:100%;padding:10px;margin-top:4px;}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}
  :root.theme-dark .sidebar{background:linear-gradient(180deg,#241C17,#1A130F);}
  :root.theme-dark #loginScreen{background:radial-gradient(circle at 50% 20%,#241C17,#15100C 75%);}
  .theme-switch{display:flex;gap:4px;padding:0 16px;margin-top:-8px;}
  .theme-btn{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    padding:6px 0;border-radius:6px;font-size:13px;cursor:pointer;line-height:1;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  }
  .theme-btn:hover{color:var(--text);border-color:var(--gold);}
  .theme-btn.active{background:var(--gold);color:var(--btn-text);border-color:var(--gold);}
  .login-links{margin-top:14px;font-size:12px;}
  .login-links a{color:var(--gold);text-decoration:none;cursor:pointer;}
  .login-links a:hover{text-decoration:underline;}
  .forgot-panel{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:left;}

const EMAILJS_PUBLIC_KEY = "HgCwN8Dfn2AfOkmTZ";
const EMAILJS_SERVICE_ID = "service_f2eiyip";
const EMAILJS_TEMPLATE_ID = "template_b3hro86";
const RECOVERY_EMAIL = "caelumgreyltd@gmail.com"; // the inbox that should receive the recovery code
function emailRecoveryConfigured(){
  return EMAILJS_PUBLIC_KEY !== "YOUR_EMAILJS_PUBLIC_KEY" && EMAILJS_SERVICE_ID !== "YOUR_EMAILJS_SERVICE_ID" && EMAILJS_TEMPLATE_ID !== "YOUR_EMAILJS_TEMPLATE_ID";
}
if(window.emailjs && emailRecoveryConfigured()){ emailjs.init(EMAILJS_PUBLIC_KEY); }
const LOGIN_SESSION_KEY = "pdcrm_logged_in";
const ROLE_SESSION_KEY = "pdcrm_role";
const PASS_OWNER_KEY = "pdcrm_pass_owner";
const PASS_STAFF_KEY = "pdcrm_pass_staff";
let currentRole = 'owner';

function getOwnerPasscode(){ return localStorage.getItem(PASS_OWNER_KEY) || APP_PASSCODE; }
function getStaffPasscode(){ return localStorage.getItem(PASS_STAFF_KEY) || APP_PASSCODE_STAFF; }
function setOwnerPasscode(v){ localStorage.setItem(PASS_OWNER_KEY, v); }
function setStaffPasscode(v){ localStorage.setItem(PASS_STAFF_KEY, v); }

function isStaff(){ return currentRole === 'staff'; }
function applyRoleBodyClass(){ document.body.classList.toggle('role-staff', isStaff()); }

function tryLogin(){
  const val = document.getElementById('loginPass').value;
  if(val === getOwnerPasscode()){
    currentRole = 'owner';
    sessionStorage.setItem(LOGIN_SESSION_KEY, 'yes');
    sessionStorage.setItem(ROLE_SESSION_KEY, 'owner');
    applyRoleBodyClass();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    loadData();
  }else if(val === getStaffPasscode()){
    currentRole = 'staff';
    sessionStorage.setItem(LOGIN_SESSION_KEY, 'yes');
    sessionStorage.setItem(ROLE_SESSION_KEY, 'staff');
    applyRoleBodyClass();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    loadData();
  }else{
    document.getElementById('loginError').textContent = 'Incorrect passcode. Try again.';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
  }
}

function emailRecoveryCode(){
  const statusEl = document.getElementById('emailRecoveryStatus');
  if(!emailRecoveryConfigured() || !window.emailjs){
    statusEl.style.color = 'var(--amber)';
    statusEl.textContent = "Email recovery isn't set up yet — use the recovery code below instead.";
    return;
  }
  statusEl.style.color = 'var(--text-muted)';
  statusEl.textContent = 'Sending…';
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    recovery_code: RECOVERY_CODE,

// --- Local PC backup (in addition to Firebase) ---
// 1) Automatic, invisible browser-storage copy — always on, no setup.
// 2) Optional real file on disk — pick it once, it silently re-saves on every change (Chrome/Edge only).
const LOCAL_BACKUP_LS_KEY = 'pdcrm_local_backup';
const LOCAL_BACKUP_IDB_DB = 'pdcrm_backup_db';
const LOCAL_BACKUP_IDB_STORE = 'handles';
const LOCAL_BACKUP_IDB_KEY = 'backupFileHandle';
let localBackupFileHandle = null;
let localBackupFileStatus = 'unsupported'; // 'unsupported' | 'disconnected' | 'needs-permission' | 'connected'
let localBackupFileName = '';
let localBackupLastSavedAt = null;

function fsAccessSupported(){ return typeof window.showSaveFilePicker === 'function'; }

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(LOCAL_BACKUP_IDB_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(LOCAL_BACKUP_IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(LOCAL_BACKUP_IDB_STORE, 'readonly');
      const req = tx.objectStore(LOCAL_BACKUP_IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ console.error('idbGet failed', e); return null; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(LOCAL_BACKUP_IDB_STORE, 'readwrite');
      tx.objectStore(LOCAL_BACKUP_IDB_STORE).put(val, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ console.error('idbSet failed', e); return false; }
}

}

// Optional real file on disk, chosen once via the File System Access API.
async function restoreLocalBackupFileHandle(){
  if(!fsAccessSupported()){ localBackupFileStatus = 'unsupported'; return; }
  const handle = await idbGet(LOCAL_BACKUP_IDB_KEY);
  if(!handle){ localBackupFileStatus = 'disconnected'; return; }
  localBackupFileHandle = handle;
  localBackupFileName = handle.name || '';
  try{
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    localBackupFileStatus = perm === 'granted' ? 'connected' : 'needs-permission';
  }catch(e){
    console.error('checking file permission failed', e);
    localBackupFileStatus = 'needs-permission';
  }
}
async function chooseLocalBackupFile(){
  if(!fsAccessSupported()){
    alert('Your browser doesn\'t support saving directly to a file on your PC. Use Chrome or Edge for this feature — the automatic browser backup is still protecting your data either way.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'prettydollgh-crm-backup.json',
      types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }]
    });
    localBackupFileHandle = handle;
    localBackupFileName = handle.name || '';
    await idbSet(LOCAL_BACKUP_IDB_KEY, handle);
    localBackupFileStatus = 'connected';
    await writeLocalBackupFile();
    renderDataView();
  }catch(e){
    if(e && e.name !== 'AbortError') console.error('choosing backup file failed', e);
  }
}
async function reconnectLocalBackupFile(){
  if(!localBackupFileHandle) return chooseLocalBackupFile();
  try{
    const perm = await localBackupFileHandle.requestPermission({ mode: 'readwrite' });
    localBackupFileStatus = perm === 'granted' ? 'connected' : 'needs-permission';
    if(perm === 'granted') await writeLocalBackupFile();
  }catch(e){ console.error('requesting file permission failed', e); }
  renderDataView();
}
async function writeLocalBackupFile(){
  if(!localBackupFileHandle || localBackupFileStatus !== 'connected') return;
  try{
    const writable = await localBackupFileHandle.createWritable();
    await writable.write(JSON.stringify(DATA, null, 2));
    await writable.close();
    localBackupLastSavedAt = new Date();
  }catch(e){
    console.error('writing local backup file failed', e);
    localBackupFileStatus = 'needs-permission';
  }
}
function forgetLocalBackupFile(){
  localBackupFileHandle = null;
  localBackupFileName = '';
  localBackupLastSavedAt = null;
  localBackupFileStatus = fsAccessSupported() ? 'disconnected' : 'unsupported';
  idbSet(LOCAL_BACKUP_IDB_KEY, null);
  renderDataView();
}

function applySearch(items, q, fields){
  if(!q || !q.trim()) return items;
  const needle = q.trim().toLowerCase();
  return items.filter(item=>fields.some(f=>{
    const v = typeof f==='function' ? f(item) : item[f];
    return String(v??'').toLowerCase().includes(needle);
  }));
}
function applySort(items, view, extractors){
  const st = viewState[view];
  if(!st.sortKey || !extractors[st.sortKey]) return items;
  const ext = extractors[st.sortKey];
  return [...items].sort((a,b)=>{
    let av = ext(a), bv = ext(b);
    if(typeof av==='string') av = av.toLowerCase();
    if(typeof bv==='string') bv = bv.toLowerCase();
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(av<bv) return -1*st.sortDir;
    if(av>bv) return 1*st.sortDir;
    return 0;
  });
}

function csvEscape(val){
  const s = String(val??'');
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(',')));
  downloadFile(filename, lines.join('\r\n'), 'text/csv;charset=utf-8;');
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1); // strip BOM
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      } else { field+=c; i++; continue; }
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]??'').trim());
    return obj;
  });
}

      });
      saveData(); fileInput.value=''; render();
      alert(`Imported: ${added} added, ${updated} updated.`);

          type: r.type || r.Type || 'Other',

          reorderLevel: reorderRaw!=null && reorderRaw!=='' ? (Number(reorderRaw)||10) : 10,
        };
        if(onHandRaw!=null && onHandRaw!=='') rec.stockOnHand = Number(onHandRaw)||0;
        if(soldRaw!=null && soldRaw!=='') rec.unitsSold = Number(soldRaw)||0;
        if(remainingRaw!=null && remainingRaw!=='') rec.stockRemaining = Number(remainingRaw)||0;
        const idx = DATA.products.findIndex(p=>p.name===name);
        if(idx>=0){ DATA.products[idx] = {...DATA.products[idx], ...rec}; updated++; }
        else { DATA.products.push(rec); added++; }

async function loadData(){
  await restoreLocalBackupFileHandle();
  if(!firebaseConfigured){
    const backup = loadLocalStorageBackup();
    DATA = backup ? backup.data : JSON.parse(JSON.stringify(SEED));
    render();
    alert(backup
      ? 'This CRM isn\'t connected to a shared database yet, so it loaded your most recent local backup from ' + new Date(backup.savedAt).toLocaleString() + ' instead. Changes will keep saving locally, but won\'t be shared with other devices.'
      : 'This CRM isn\'t connected to a shared database yet. Data entered now will only be saved locally on this PC/browser, not shared. Paste your Firebase Database URL into FIREBASE_DB_URL near the top of the script to fix this.');
    return;
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json`);
    if(!res.ok) throw new Error('Firebase request failed: ' + res.status);
    const json = await res.json();
    DATA = json || JSON.parse(JSON.stringify(SEED));
  }catch(e){
    console.error('load failed, checking local backup:', e);
    const backup = loadLocalStorageBackup();
    if(backup){
      DATA = backup.data;
      alert('Could not reach the shared database, so this loaded your most recent local backup from ' + new Date(backup.savedAt).toLocaleString() + ' instead. Changes will keep saving locally; reconnect to the internet and this will sync back to Firebase.');
    } else {
      DATA = JSON.parse(JSON.stringify(SEED));
      alert('Could not reach the shared database, and no local backup was found on this device, so nothing was loaded. Check your internet connection and reload. (Any changes you make now will not be saved.)');
    }
  }
  if(!Array.isArray(DATA.expectedRestocks)) DATA.expectedRestocks = [];
  render();
}
async function pushDataToFirebaseNow(){
  if(isStaff()) return;
  const statusEl = document.getElementById('firebaseSyncStatus');
  if(!firebaseConfigured){
    if(statusEl){ statusEl.style.color = 'var(--red)'; statusEl.textContent = 'No Firebase URL is configured — nothing to push to.'; }
    return;
  }
  if(statusEl){ statusEl.style.color = 'var(--text-muted)'; statusEl.textContent = 'Pushing…'; }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('Firebase push failed: ' + res.status);
    if(statusEl){ statusEl.style.color = 'var(--green)'; statusEl.textContent = 'Done — this data is now the shared copy every device will load.'; }
  }catch(e){
    console.error('push failed', e);
    if(statusEl){ statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Could not reach Firebase. Check your internet connection and try again.'; }
  }
}

async function saveData(){
  // Always keep the local copies up to date first, regardless of what happens with Firebase.
  saveLocalStorageBackup();
  writeLocalBackupFile(); // fire-and-forget; failures are logged, not alerted

  if(!firebaseConfigured){
    console.warn('Firebase not configured — this save was only kept locally.');
    return;
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${FIREBASE_PATH}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('Firebase save failed: ' + res.status);
  }catch(e){
    console.error('save failed', e);
    alert('Could not save to the shared database, so this change only saved locally on this PC for now. Reconnect to the internet and make another small edit to sync it back up — or use "Push Current Data to Firebase Now" in Data & Backup.');
  }
}

/* ---------- computed helpers ---------- */
function getCustomerType(name){
  const manual = DATA.customers.find(x=>x.name===name);
  return (manual && manual.type) || 'Individual';
}
function customerComputed(name){
  const orders = DATA.orders.filter(o=>o.customer===name);
  const totalOrders = orders.length;
  const totalSpent = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
  const dates = orders.map(o=>o.date).filter(Boolean).sort();
  const lastOrderDate = dates.length ? dates[dates.length-1] : null;
  let status = 'New';
  if(lastOrderDate){
    const days = (Date.now() - new Date(lastOrderDate).getTime())/86400000;
    status = days<=30 ? 'Active' : days<=90 ? 'At Risk' : 'Churned';
  }
  const followUps = DATA.interactions
    .map((f,idx)=>({...f, idx}))
    .filter(f=>f.customer===name && f.followUpDate && f.followUpDone!=='Yes')
    .sort((a,b)=>(a.followUpDate||'').localeCompare(b.followUpDate||''));
  const nextFollowUp = followUps.length ? followUps[0].followUpDate : null;
  const nextFollowUpIdx = followUps.length ? followUps[0].idx : null;
  return {totalOrders, totalSpent, lastOrderDate, status, nextFollowUp, nextFollowUpIdx};
}
function productComputed(name){
  const stockOnHand = DATA.restocks.filter(r=>r.product===name).reduce((s,r)=>s+(Number(r.qty)||0),0);
  const unitsSold = DATA.orderItems.filter(i=>i.product===name).reduce((s,i)=>s+(Number(i.qty)||0),0);
  const stockRemaining = stockOnHand - unitsSold;
  return {stockOnHand, unitsSold, stockRemaining};
}
function mondayOf(d){
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}
function weekRange(mondayStr){
  const start = new Date(mondayStr+'T00:00:00');
  const end = new Date(mondayStr+'T00:00:00');
  end.setDate(end.getDate()+6);
  end.setHours(23,59,59,999);
  return {start, end};
}
function weekLabel(mondayStr){
  const {start,end} = weekRange(mondayStr);
  const sameMonth = start.getMonth()===end.getMonth();
  const optsFull = {day:'numeric', month:'short'};
  const startLbl = start.toLocaleDateString('en-GB', sameMonth?{day:'numeric'}:optsFull);
  const endLbl = end.toLocaleDateString('en-GB', optsFull) + ' ' + end.getFullYear();
  return `${startLbl} – ${endLbl}`;
}
function weekRevenue(mondayStr){
  const {start,end} = weekRange(mondayStr);
  return DATA.orders.filter(o=>{
    if(!o.date) return false;
    const d = new Date(o.date);
    return d>=start && d<=end;
  }).reduce((s,o)=>s+(Number(o.total)||0),0);
}
function weekOrdersCount(mondayStr){
  const {start,end} = weekRange(mondayStr);
  return DATA.orders.filter(o=>{
    if(!o.date) return false;
    const d = new Date(o.date);
    return d>=start && d<=end;
  }).length;
}
function newLeadsInWeek(mondayStr){
  const {start,end} = weekRange(mondayStr);
  return DATA.leads.filter(l=>{
    if(!l.dateAdded) return false;
    const d = new Date(l.dateAdded);
    return d>=start && d<=end;
  }).length;
}
function monthRevenue(month, year){
  return DATA.orders.filter(o=>{
    if(!o.date) return false;
    const d = new Date(o.date);
    return (d.getMonth()+1)===month && d.getFullYear()===year;
  }).reduce((s,o)=>s+(Number(o.total)||0),0);
}
function cumulativeRevenueThrough(month, year){
  const end = new Date(year, month, 0, 23,59,59);
  return DATA.orders.filter(o=>o.date && new Date(o.date) <= end)
    .reduce((s,o)=>s+(Number(o.total)||0),0);
}
function revenueTrendSeries(endMonth, endYear, count){
  const series = [];
  for(let i=count-1;i>=0;i--){
    let m = endMonth - i;
    let y = endYear;
    while(m<1){ m+=12; y-=1; }
    series.push({month:m, year:y, label: MONTHS[m-1].slice(0,3)+' '+String(y).slice(2), revenue: monthRevenue(m,y)});
  }
  return series;
}
let currentTrendPoints = [];
function renderTrendChartSVG(series){
  const w = 700, h = 220, padL = 44, padR = 12, padT = 16, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const max = Math.max(1, ...series.map(s=>s.revenue));
  const stepX = series.length>1 ? plotW/(series.length-1) : plotW;
  const pts = series.map((s,i)=>{
    const x = padL + i*stepX;
    const y = padT + plotH - (s.revenue/max)*plotH;
    return {x,y,...s};
  });
  currentTrendPoints = pts;
  const linePath = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${pts[pts.length-1].x.toFixed(1)},${padT+plotH} L${pts[0].x.toFixed(1)},${padT+plotH} Z`;
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity="0.35"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted)">${fmtMoneyShort(f*max)}</text>`;
  }).join('');
  const xLabels = pts.map((p,i)=>{
    if(series.length>8 && i%2!==0 && i!==series.length-1) return '';
    return `<text x="${p.x.toFixed(1)}" y="${h-10}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${p.label}</text>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--gold-bright)"/>`).join('');
  return `<svg id="trendSvg" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--gold-bright)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--gold-bright)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#trendFill)"/>
    <path d="${linePath}" fill="none" stroke="var(--gold-bright)" stroke-width="2"/>
    ${dots}
    ${xLabels}
    <line id="trendGuideLine" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="var(--gold-bright)" stroke-width="1" stroke-dasharray="3,3" opacity="0" pointer-events="none"/>
    <circle id="trendGuideDot" r="4.5" fill="var(--gold-bright)" stroke="var(--surface)" stroke-width="1.5" opacity="0" pointer-events="none"/>
    <g id="trendTooltipGroup" opacity="0" pointer-events="none">
      <rect id="trendTooltipBg" width="96" height="34" rx="6" fill="var(--surface-2)" stroke="var(--gold)" stroke-width="1"/>
      <text id="trendTooltipMonth" font-size="9" fill="var(--text-muted)"></text>
      <text id="trendTooltipAmount" font-size="12" font-weight="700" fill="var(--gold-bright)"></text>
    </g>
    <rect id="trendOverlay" x="${padL}" y="0" width="${plotW}" height="${h}" fill="transparent" style="cursor:crosshair;"/>
  </svg>`;
}
function attachTrendChartInteractivity(){
  const svg = document.getElementById('trendSvg');
  const overlay = document.getElementById('trendOverlay');
  if(!svg || !overlay || !currentTrendPoints.length) return;
  const guideLine = document.getElementById('trendGuideLine');
  const guideDot = document.getElementById('trendGuideDot');
  const tooltipG = document.getElementById('trendTooltipGroup');
  const tooltipBg = document.getElementById('trendTooltipBg');
  const tMonth = document.getElementById('trendTooltipMonth');
  const tAmount = document.getElementById('trendTooltipAmount');
  const w = 700, h = 220;

  function svgX(evt){
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    return ((clientX - rect.left) / rect.width) * w;
  }
  function nearest(x){
    let best = currentTrendPoints[0], bestD = Infinity;
    currentTrendPoints.forEach(p=>{ const d = Math.abs(p.x-x); if(d<bestD){ bestD=d; best=p; } });
    return best;
  }
  function show(evt){
    const p = nearest(svgX(evt));
    guideLine.setAttribute('x1', p.x); guideLine.setAttribute('x2', p.x); guideLine.setAttribute('opacity','1');
    guideDot.setAttribute('cx', p.x); guideDot.setAttribute('cy', p.y); guideDot.setAttribute('opacity','1');
    tMonth.textContent = p.label;
    tAmount.textContent = fmtMoney(p.revenue);
    const boxW = 96, boxH = 34;
    let bx = p.x + 10; if(bx + boxW > w-6) bx = p.x - boxW - 10;
    let by = p.y - boxH - 8; if(by < 2) by = p.y + 10;
    tooltipBg.setAttribute('x', bx); tooltipBg.setAttribute('y', by);
    tMonth.setAttribute('x', bx+8); tMonth.setAttribute('y', by+13);
    tAmount.setAttribute('x', bx+8); tAmount.setAttribute('y', by+27);
    tooltipG.setAttribute('opacity','1');
  }
  function hide(){
    guideLine.setAttribute('opacity','0');
    guideDot.setAttribute('opacity','0');
    tooltipG.setAttribute('opacity','0');
  }
  overlay.addEventListener('mousemove', show);
  overlay.addEventListener('mouseleave', hide);
  overlay.addEventListener('touchmove', e=>{ show(e); e.preventDefault(); }, {passive:false});
  overlay.addEventListener('touchend', hide);
}
function fmtMoneyShort(n){
  n = Number(n)||0;
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(0)+'k';
  return String(Math.round(n));
}
function overdueFollowUps(){
  const today = new Date(); today.setHours(0,0,0,0);
  return DATA.interactions.filter(i=>i.followUpDate && new Date(i.followUpDate) < today && i.followUpDone!=='Yes');
}
function lowStockProducts(){
  return DATA.products.filter(p=>{
    if(!p.reorderLevel) return false;
    const {stockRemaining} = productComputed(p.name);
    return stockRemaining < Number(p.reorderLevel);
  });
}
function nextExpectedRestock(productName){
  const pending = (DATA.expectedRestocks||[])
    .filter(e=>e.product===productName && e.status!=='Received')
    .sort((a,b)=>(a.expectedDate||'').localeCompare(b.expectedDate||''));
  return pending.length ? pending[0] : null;
}
function outstandingBalance(){ return DATA.orders.reduce((s,o)=>s+(Number(o.balance)||0),0); }
function avgOrderValue(){
  if(!DATA.orders.length) return 0;
  const total = DATA.orders.reduce((s,o)=>s+(Number(o.total)||0),0);
  return total/DATA.orders.length;
}
function grossProfit(){
  let profit = 0;
  DATA.orderItems.forEach(it=>{
    const prod = DATA.products.find(p=>p.name===it.product);
    if(prod && prod.costPrice!=null){
      profit += ((Number(it.unitPrice)||0) - Number(prod.costPrice)) * (Number(it.qty)||0);
    }
  });
  return profit;
}
function leadConversionRate(){
  if(!DATA.leads.length) return null;
  const converted = DATA.leads.filter(l=>l.status==='Converted').length;
  return (converted/DATA.leads.length)*100;
}
function repeatCustomerRate(){
  const names = allCustomerNames();
  if(!names.length) return null;
  const repeat = names.filter(n=>customerComputed(n).totalOrders>1).length;
  return (repeat/names.length)*100;
}
function inventoryValue(){
  return DATA.products.reduce((s,p)=>{
    const {stockRemaining} = productComputed(p.name);
    if(typeof stockRemaining !== 'number' || stockRemaining<=0) return s;
    const cost = p.costPrice!=null ? Number(p.costPrice) : Number(p.sellingPrice)||0;
    return s + stockRemaining*cost;
  },0);
}
const SALE_CHANNELS = ['TikTok Live','IG/WhatsApp DM','Marketplace Table','Salon/Bulk Order','Other'];
function salesByChannel(){
  const map = {};
  SALE_CHANNELS.forEach(c=>map[c]=0);
  DATA.orders.forEach(o=>{
    const ch = o.channel && SALE_CHANNELS.includes(o.channel) ? o.channel : 'Other';
    map[ch] = (map[ch]||0) + (Number(o.total)||0);
  });
  return Object.entries(map).filter(([,rev])=>rev>0).sort((a,b)=>b[1]-a[1]);
}
function topProducts(n){
  const map = {};
  DATA.orderItems.forEach(it=>{
    const rev = Number(it.lineTotal)!=null ? Number(it.lineTotal) : (Number(it.qty)||0)*(Number(it.unitPrice)||0);
    map[it.product] = (map[it.product]||0) + rev;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
function topCustomersBySpend(n){
  return allCustomerNames()
    .map(name=>({name, ...customerComputed(name)}))
    .filter(c=>c.totalSpent>0)
    .sort((a,b)=>b.totalSpent-a.totalSpent)
    .slice(0,n);
}
function allCustomerNames(){
  const fromOrders = DATA.orders.map(o=>o.customer);
  const fromList = DATA.customers.map(c=>c.name);
  return Array.from(new Set([...fromList, ...fromOrders])).filter(Boolean);
}
function allNamesIncludingLeads(){
  return Array.from(new Set([...allCustomerNames(), ...DATA.leads.map(l=>l.name)])).filter(Boolean);
}

function saveCustomer(idx){
  if(isStaff()) return;
  const name = document.getElementById('f_name').value.trim();

  const rec = {
    name, phone: document.getElementById('f_phone').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    segment: document.getElementById('f_segment').value,
    type: document.getElementById('f_type').value,
  };
  if(idx!=null && idx>=0) DATA.customers[idx] = rec; else DATA.customers.push(rec);
  saveData(); closeModal(); render();

function deleteCustomer(name){
  if(isStaff()) return;
  if(!confirm(`Delete the customer profile for "${name}"? Their past orders will stay on record.`)) return;
  const idx = DATA.customers.findIndex(x=>x.name===name);
  if(idx>=0) DATA.customers.splice(idx,1);
  saveData(); closeModal(); render();
}

function autofillItemRow(productInput){
  // when a product name is typed/picked, prefill Colour/Packing from the matching product record
  // (only if the row's field is still empty, so manual edits are never overwritten)
  const row = productInput.closest('.item-row');
  if(!row) return;
  const name = productInput.value.trim();
  const match = DATA.products.find(p=>p.name===name);
  if(!match) return;
  const colourEl = row.querySelector('.it-colour');
  if(colourEl && !colourEl.value.trim() && match.colour!=null && match.colour!=='N/A') colourEl.value = match.colour;
}
function saveOrder(orderId){
  if(isStaff()) return;
  const customer = document.getElementById('o_customer').value.trim();
  if(!customer){ alert('Customer is required.'); return; }
  const newId = document.getElementById('o_orderid').value.trim();
  if(!newId){ alert('Order ID is required.'); return; }
  const clash = DATA.orders.find(o=>o.orderId===newId && o.orderId!==orderId);
  if(clash){ alert(`Order ID "${newId}" is already used by another order. Pick a different one.`); return; }
  const date = document.getElementById('o_date').value;
  const paid = Number(document.getElementById('o_paid').value)||0;
  const paymentStatus = document.getElementById('o_payment').value;
  const orderStatus = document.getElementById('o_status').value;
  const channel = document.getElementById('o_channel').value;

  const itemEls = document.querySelectorAll('#itemsEditor .item-row');
  let total = 0;
  const id = newId;
  const items = [];
  let lineNum = 1;
  itemEls.forEach(row=>{
    const product = row.querySelector('.it-product').value.trim();
    const colour = row.querySelector('.it-colour').value.trim();
    const qty = Number(row.querySelector('.it-qty').value)||0;
    const price = Number(row.querySelector('.it-price').value)||0;
    if(!product || !qty) return;
    const lineTotal = qty*price;
    total += lineTotal;
    items.push({orderId:id, product, colour, qty, unitPrice:price, lineTotal, orderDate:date, lineNum, matchKey:`${id}|${lineNum}`});
    lineNum++;
  });
  if(!items.length){ alert('Add at least one item.'); return; }

  if(orderId){
    const idx = DATA.orders.findIndex(o=>o.orderId===orderId);
    if(idx>=0){
      DATA.orders[idx] = {...DATA.orders[idx], orderId:id, date, customer, total, amountPaid:paid, balance: total-paid, paymentStatus, orderStatus, channel};
    }
    DATA.orderItems = DATA.orderItems.filter(i=>i.orderId!==orderId);
    DATA.orderItems.push(...items);
  }else{
    DATA.orders.push({
      orderId:id, date, customer, phone:'', total, amountPaid:paid, balance: total-paid,
      paymentStatus, orderStatus, channel, deliveryDate:null, createdAt:new Date().toISOString()
    });
    DATA.orderItems.push(...items);
  }

  // if this was a lead, mark it converted (remember prior status so we can revert if the order is later deleted)
  const lead = DATA.leads.find(l=>l.name===customer);
  if(lead && lead.status !== 'Converted'){
    lead._preConvertStatus = lead.status;
    lead.status = 'Converted';
  }

  saveData(); closeModal(); render();
}
function deleteOrder(orderId){
  if(isStaff()) return;
  if(!confirm(`Delete order ${orderId}? This also removes its line items.`)) return;
  const deletedOrder = DATA.orders.find(o=>o.orderId===orderId);
  DATA.orders = DATA.orders.filter(o=>o.orderId!==orderId);
  DATA.orderItems = DATA.orderItems.filter(i=>i.orderId!==orderId);

  // if that customer has no other orders left, un-convert their lead back to its pre-conversion status
  if(deletedOrder){
    const stillHasOrders = DATA.orders.some(o=>o.customer===deletedOrder.customer);
    if(!stillHasOrders){
      const lead = DATA.leads.find(l=>l.name===deletedOrder.customer);
      if(lead && lead.status==='Converted'){
        lead.status = lead._preConvertStatus || 'New';
        delete lead._preConvertStatus;
      }
    }
  }

  saveData(); closeModal(); render();
}

function adjustProductOnHand(idx, newValStr){
  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  const newVal = Math.max(0, Math.round(Number(newValStr)||0));
  const current = productComputed(p.name).stockOnHand;
  const diff = newVal - current;
  if(diff === 0){ renderProducts(); return; }
  DATA.restocks.push({
    date: new Date().toISOString().slice(0,10),
    product: p.name,
    qty: diff,
    costPrice: null,
    supplier: null,
    consignmentId: 'ADJUSTMENT',
    notes: `Manual on-hand adjustment (was ${current}, set to ${newVal})`,
    createdAt: new Date().toISOString()
  });
  saveData(); renderProducts();
}
function adjustProductRemaining(idx, newValStr){
  if(isStaff()) return;
  const p = DATA.products[idx];
  if(!p) return;
  const newVal = Math.round(Number(newValStr)||0);
  const {stockRemaining: current, unitsSold} = productComputed(p.name);
  const diff = newVal - current;
  if(diff === 0){ renderProducts(); return; }
  // Editing Remaining works backwards: since Remaining = On Hand - Sold, and Sold
  // reflects real order history that shouldn't change, the gap is absorbed as a
  // stock adjustment (same mechanism as the On Hand field) so On Hand moves by the
  // same amount and Remaining lands exactly on the value that was typed in.
  DATA.restocks.push({
    date: new Date().toISOString().slice(0,10),
    product: p.name,
    qty: diff,
    costPrice: null,
    supplier: null,
    consignmentId: 'ADJUSTMENT',
    notes: `Manual remaining adjustment (was ${current}, set to ${newVal}, on-hand shifted by ${diff>0?'+':''}${diff} to ${current+unitsSold+diff})`,
    createdAt: new Date().toISOString()
  });
  saveData(); renderProducts();
}

function expectedRestockStatus(e){
  if(e.status==='Received') return 'Received';
  const today = new Date(); today.setHours(0,0,0,0);
  if(e.expectedDate && new Date(e.expectedDate) < today) return 'Overdue';
  return 'Pending';
}
function getFilteredSortedExpectedRestocks(){
  const withIdx = (DATA.expectedRestocks||[]).map((e,idx)=>({...e, __idx:idx}));
  let items = applySearch(withIdx, viewState.expectedRestocks.q, ['product','supplier','notes']);
  items = applySort(items, 'expectedRestocks', {
    date: e=>e.expectedDate, product: e=>e.product, qty: e=>Number(e.qty)||0,
    cost: e=>Number(e.costPrice)||0, supplier: e=>e.supplier, status: e=>expectedRestockStatus(e),
  });
  if(!viewState.expectedRestocks.sortKey) items = [...items].sort((a,b)=>{
    // Pending/Overdue batches first (soonest first), Received batches last
    const aRec = a.status==='Received', bRec = b.status==='Received';
    if(aRec!==bRec) return aRec ? 1 : -1;
    return (a.expectedDate||'').localeCompare(b.expectedDate||'');
  });
  return items;
}

  const sorted = [...DATA.orders].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const filtered = term ? sorted.filter(o=>{
    const invNo = 'INV-' + String(o.orderId).replace('ORD-','').trim();
    return String(o.orderId).toLowerCase().includes(term) ||
           (o.customer||'').toLowerCase().includes(term) ||
           invNo.toLowerCase().includes(term);
  }) : sorted;

  select.innerHTML = '<option value="">— Select an order —</option>' +
    filtered.map(o=>`<option value="${o.orderId}">${o.orderId} · ${o.customer} · ${fmtDate(o.date)} · ${fmtMoney(o.total)}</option>`).join('');

  if(filtered.length){

function printInvoice(invNo){
  const oldTitle = document.title;
  document.title = invNo;
  window.print();
  setTimeout(()=>{ document.title = oldTitle; }, 500);
}

function recalcInvoiceTotals(){
  const block = document.getElementById('invTotalsBlock');
  const subtotal = Number(block.dataset.subtotal)||0;
  const discount = Number(document.getElementById('inv_discount').value)||0;
  const delivery = Number(document.getElementById('inv_delivery').value)||0;
  const paid = Number(document.getElementById('inv_paid').value)||0;
  const totalDue = subtotal - discount + delivery;
  const balance = totalDue - paid;
  document.getElementById('inv_total_due').textContent = fmtMoney(totalDue);
  document.getElementById('inv_balance_due').textContent = fmtMoney(balance);
}

/* ---------- DATA / BACKUP ---------- */

    <div class="page-head">

      <div class="data-block">

          : 'No shared database is connected yet — data currently only lives in this file. Add a Firebase Database URL to FIREBASE_DB_URL near the top of the script to enable this.'}</div>

          <button class="btn" onclick="pushDataToFirebaseNow()" ${firebaseConfigured?'':'disabled'}>⬆ Push Current Data to Firebase Now</button>

      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Local Backup (This PC)</h3></div>
      <div class="data-block">
        <div class="hint">Every save is now also kept on this PC — just in case Firebase ever fails. A copy is stored automatically in this browser, and you can optionally connect a real file on disk that updates itself every time something changes.</div>
        ${localBackupFileStatus === 'unsupported' ? `
          <div class="hint" style="margin-top:8px;">Real-file backup needs Chrome or Edge on a computer. The automatic browser backup above is active regardless.</div>
        ` : localBackupFileStatus === 'connected' ? `
          <div class="hint" style="margin-top:8px;color:var(--green);">✓ Connected to <b>${localBackupFileName}</b> — saved automatically on every change${localBackupLastSavedAt ? ' (last write: ' + localBackupLastSavedAt.toLocaleTimeString() + ')' : ''}.</div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn-ghost" onclick="chooseLocalBackupFile()">Choose a Different File</button>
            <button class="btn-ghost" onclick="forgetLocalBackupFile()">Disconnect</button>
          </div>
        ` : localBackupFileStatus === 'needs-permission' ? `
          <div class="hint" style="margin-top:8px;color:var(--red);">Connected to <b>${localBackupFileName}</b>, but this tab needs permission again before it can keep writing to it.</div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" onclick="reconnectLocalBackupFile()">Reconnect Backup File</button>
            <button class="btn-ghost" onclick="forgetLocalBackupFile()">Disconnect</button>
          </div>
        ` : `
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" onclick="chooseLocalBackupFile()">Choose Backup File on This PC</button>
          </div>
        `}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Full Backup</h3></div>
      <div class="data-block">
        <div class="hint">Download a complete backup of every customer, order, product, restock, lead and interaction — as one JSON file (for restoring here later) or as an Excel workbook with a tab per table (for opening in Excel/Sheets). Use Restore to bring a JSON backup back into the app, or to move it to another device/browser.</div>
        <div class="btn-row">
          <button class="btn" onclick="exportBackup()">⬇ Download Full Backup (JSON)</button>
          <button class="btn" onclick="exportBackupExcel()">⬇ Download Full Backup (Excel)</button>
          <button class="btn-ghost" onclick="triggerImportBackup()">⬆ Restore from Backup</button>
          <input type="file" id="importBackupInput" accept=".json,application/json" style="display:none;" onchange="importBackupFile(this)">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Export Tables as CSV</h3></div>
      <div class="data-block">
        <div class="hint">Download any table as a spreadsheet (.csv), respecting whatever search/sort you last used on that page.</div>
        <div class="btn-row">
          <button class="btn-ghost" onclick="exportCustomersCSV()">Customers CSV</button>
          <button class="btn-ghost" onclick="exportOrdersCSV()">Orders CSV</button>
          <button class="btn-ghost" onclick="exportProductsCSV()">Products CSV</button>
          <button class="btn-ghost" onclick="exportRestocksCSV()">Restocks CSV</button>
          <button class="btn-ghost" onclick="exportLeadsCSV()">Leads CSV</button>
          <button class="btn-ghost" onclick="exportInteractionsCSV()">Interactions CSV</button>

      </div>

    <div class="card">

        <div class="btn-row">
          <label class="btn-ghost" style="cursor:pointer;">Import Customers CSV<input type="file" accept=".csv,text/csv" style="display:none;" onchange="importCustomersCSV(this)"></label>

}

/* ---------- router ---------- */
function render(){
  if(isStaff() && (currentView==='invoices' || currentView==='data')) currentView = 'dashboard';
  renderNav();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='customers') renderCustomers();
  else if(currentView==='customerDetail') renderCustomerDetail(selectedCustomerDetail);
  else if(currentView==='orders') renderOrders();
  else if(currentView==='invoices') renderInvoices();
  else if(currentView==='products') renderProducts();
  else if(currentView==='restocks') renderRestocks();
  else if(currentView==='leads') renderLeads();
  else if(currentView==='interactions') renderInteractions();
  else if(currentView==='data') renderDataView();
  const mainEl = document.getElementById('main');
  mainEl.style.animation = 'none';
  void mainEl.offsetWidth;
  mainEl.style.animation = '';
}

initApp();
</script>
</body>
</html>
